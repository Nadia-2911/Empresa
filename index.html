<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nombre de Empresa App</title>
    
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    
    <!-- Configuración nativa de Tailwind para colores dinámicos -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--primary)',
                        'primary-glow': 'var(--primary-glow)'
                    }
                }
            }
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- Librería para generar PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
        .animate-fade-in { animation: fadeIn 0.2s ease-out; }
        .animate-slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .header-logo {
            filter: brightness(0) invert(1);
        }

        .bank-card-container {
            background: #1e293b; 
            color: white;
            border-radius: 2rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .bank-card-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            padding: 0.75rem;
            width: 100%;
            outline: none;
            transition: all 0.2s;
            color: white;
        }

        .bank-card-input:focus {
            background: rgba(255, 255, 255, 1);
            border-color: var(--primary);
        }

        .sold-table-container {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .sold-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            min-width: 650px; 
        }

        .sold-table th {
            text-align: left;
            padding: 12px 16px;
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.05em;
        }

        .sold-table td {
            padding: 14px 16px;
            background: white;
            vertical-align: middle;
        }

        .sold-table tr td:first-child { border-radius: 1rem 0 0 1rem; }
        .sold-table tr td:last-child { border-radius: 0 1rem 1rem 0; }
        
        .sold-table-container::-webkit-scrollbar { height: 4px; }
        .sold-table-container::-webkit-scrollbar-track { background: transparent; }
        .sold-table-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        #pdf-content { background: white; color: #1e293b; }
        .pdf-card { border: 1px solid #f1f5f9; background: #f8fafc; border-radius: 12px; padding: 12px; }
        .pdf-table { width: 100%; border-collapse: collapse; font-size: 10px; }
        .pdf-table th { background: var(--primary); color: white; padding: 8px; text-align: left; }
        .pdf-table td { padding: 8px; border-bottom: 1px solid #f1f5f9; }

        /* Normalizar input de color para versión Móvil */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            padding: 0;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 0.375rem; 
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // ===== SINCRONIZACIÓN CON LA NUBE (Netlify Blobs vía Netlify Functions) =====
        // Estrategia: seguimos usando localStorage exactamente como antes (no se tocó
        // ninguna lógica de guardado existente), pero además "espiamos" cada escritura
        // a localStorage y, tras un pequeño retraso (debounce), empaquetamos TODOS los
        // perfiles/negocios y los subimos a /api/empresa-data. Al iniciar sesión, se
        // hace el proceso inverso: se descarga ese paquete y se escribe en localStorage
        // ANTES de montar la app, para que la lógica original la lea como si fuera local.
        window.__cloudSyncEnabled = false;
        window.__cloudDirty = false;
        window.__isPulling = false;
        (function () {
            const originalSetItem = localStorage.setItem.bind(localStorage);
            let pushTimer = null;
            localStorage.setItem = function (key, value) {
                originalSetItem(key, value);
                if (window.__cloudSyncEnabled && !window.__isPulling && key.startsWith('empresa_')) {
                    window.__cloudDirty = true;
                    window.dispatchEvent(new CustomEvent('cloud-sync', { detail: { status: 'pending' } }));
                    clearTimeout(pushTimer);
                    pushTimer = setTimeout(window.__pushToCloud, 1200);
                }
            };

            // Si el usuario cierra la pestaña o cambia de app antes de que se cumpla el
            // retraso de arriba, forzamos el envío de inmediato (con keepalive para que
            // el navegador lo complete aunque la página ya se esté cerrando).
            const flushIfDirty = () => {
                if (window.__cloudDirty) {
                    clearTimeout(pushTimer);
                    window.__pushToCloud(true);
                }
            };
            document.addEventListener('visibilitychange', () => { if (document.hidden) flushIfDirty(); });
            window.addEventListener('pagehide', flushIfDirty);
        })();

        window.__getAuthHeaders = async function () {
            try {
                const user = window.netlifyIdentity && window.netlifyIdentity.currentUser();
                if (!user) return {};
                const token = await user.jwt();
                return { Authorization: `Bearer ${token}` };
            } catch (e) {
                return {};
            }
        };

        window.__pushToCloud = async function (keepalive = false) {
            try {
                window.dispatchEvent(new CustomEvent('cloud-sync', { detail: { status: 'saving' } }));
                const profiles = JSON.parse(localStorage.getItem('empresa_profiles_list') || '[]');
                const activeProfileId = localStorage.getItem('empresa_active_profile_id');
                const dataByProfile = {};
                profiles.forEach(p => {
                    dataByProfile[p.id] = {
                        settings: JSON.parse(localStorage.getItem(`empresa_settings__${p.id}`) || 'null'),
                        products: JSON.parse(localStorage.getItem(`empresa_products__${p.id}`) || 'null'),
                        sales: JSON.parse(localStorage.getItem(`empresa_sales__${p.id}`) || 'null'),
                        transferData: JSON.parse(localStorage.getItem(`empresa_transfer_data__${p.id}`) || 'null'),
                    };
                });
                const authHeaders = await window.__getAuthHeaders();
                await fetch('/api/empresa-data', {
                    method: 'POST',
                    keepalive,
                    headers: { 'Content-Type': 'application/json', ...authHeaders },
                    body: JSON.stringify({ profiles, activeProfileId, dataByProfile }),
                });
                window.__cloudDirty = false;
                window.dispatchEvent(new CustomEvent('cloud-sync', { detail: { status: 'saved', at: Date.now() } }));
            } catch (e) {
                console.error('No se pudo sincronizar con la nube:', e);
                window.dispatchEvent(new CustomEvent('cloud-sync', { detail: { status: 'error' } }));
            }
        };

        window.__pullFromCloud = async function () {
            window.__isPulling = true;
            try {
                const authHeaders = await window.__getAuthHeaders();
                const res = await fetch('/api/empresa-data', { headers: authHeaders });
                if (!res.ok) return;
                const cloud = await res.json();
                if (!cloud) return;
                localStorage.setItem('empresa_profiles_list', JSON.stringify(cloud.profiles || []));
                if (cloud.activeProfileId) localStorage.setItem('empresa_active_profile_id', cloud.activeProfileId);
                Object.entries(cloud.dataByProfile || {}).forEach(([pid, d]) => {
                    if (d.settings) localStorage.setItem(`empresa_settings__${pid}`, JSON.stringify(d.settings));
                    if (d.products) localStorage.setItem(`empresa_products__${pid}`, JSON.stringify(d.products));
                    if (d.sales) localStorage.setItem(`empresa_sales__${pid}`, JSON.stringify(d.sales));
                    if (d.transferData) localStorage.setItem(`empresa_transfer_data__${pid}`, JSON.stringify(d.transferData));
                });
            } catch (e) {
                console.error('No se pudo traer datos de la nube:', e);
            } finally {
                window.__isPulling = false;
            }
        };

        // Configuración por defecto
        const defaultSettings = {
            companyName: 'Nombre de Empresa',
            businessType: 'Gestión de Negocio',
            logoUrl: 'logo_blanco.png',
            primaryColor: '#54a4a5',
            rentPercentage: 10,
            categories: [
                { id: 'categoria-1', name: 'Categoría 1', color: '#f472b6', textColor: '#831843' },
                { id: 'categoria-2', name: 'Categoría 2', color: '#38bdf8', textColor: '#0c4a6e' }
            ],
            payments: [
                { id: 'efectivo', name: 'Efectivo', color: '#eab308', textColor: '#ffffff' },
                { id: 'transferencia', name: 'Transferencia', color: '#9333ea', textColor: '#ffffff' }
            ],
            hiddenStats: [],
            reportHiddenStats: [],
            statOverrides: {},
            customStats: [],
            allowMultiFilter: false
        };

        const genericProducts = [
            { id: 'prod1', name: 'Producto Genérico 1', category: ['categoria-1'], cost: 50, price: 150, rent: 15, profit: 85, stock: 15 },
            { id: 'prod2', name: 'Producto Genérico 2', category: ['categoria-2'], cost: 80, price: 200, rent: 20, profit: 100, stock: 8 }
        ];

        const genericSales = [
            {
                id: '220526001',
                date: new Date().toLocaleString(),
                isoDate: new Date().toISOString(),
                items: [{ product: genericProducts[0], quantity: 2 }],
                paymentMethod: 'efectivo',
                totalVenta: 300,
                totalCosto: 100,
                totalRenta: 30,
                totalGanancia: 170,
                totalItems: 2
            }
        ];

        // Utilidad de Fecha
        const getWeekNumber = (d) => {
            const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            date.setUTCDate(date.getUTCDate() + 4 - (date.getUTCDay()||7));
            const yearStart = new Date(Date.UTC(date.getUTCFullYear(),0,1));
            const weekNo = Math.ceil(( ( (date - yearStart) / 86400000) + 1)/7);
            return date.getUTCFullYear() + "-W" + String(weekNo).padStart(2, '0');
        };

        const parseDateFallback = (dStr) => {
            if(!dStr) return new Date();
            let d = new Date(dStr);
            if(!isNaN(d)) return d;
            const parts = dStr.split(',')[0].split('/');
            if(parts.length === 3) return new Date(`${parts[2]}-${parts[1]}-${parts[0]}`);
            return new Date();
        };

        const matchesDateFilter = (isoStr, legacyStr, filter) => {
            if (filter.mode === 'global') return true;
            const date = isoStr ? new Date(isoStr) : parseDateFallback(legacyStr);
            if (isNaN(date)) return true;

            if (filter.mode === 'day') return filter.value && date.toISOString().split('T')[0] === filter.value;
            if (filter.mode === 'month') return filter.value && date.toISOString().substring(0,7) === filter.value;
            if (filter.mode === 'week') return filter.value && getWeekNumber(date) === filter.value;
            if (filter.mode === 'range') {
                if (!filter.start || !filter.end) return true;
                const s = new Date(filter.start); s.setHours(0,0,0,0);
                const e = new Date(filter.end); e.setHours(23,59,59,999);
                return date >= s && date <= e;
            }
            return true;
        };

        const getFilterDateLabel = (filter) => {
            if (filter.mode === 'global') return 'Histórico Global';
            if (filter.mode === 'day') return `Día: ${filter.value}`;
            if (filter.mode === 'week') return `Semana: ${filter.value}`;
            if (filter.mode === 'month') return `Mes: ${filter.value}`;
            if (filter.mode === 'range') return `Del ${filter.start} al ${filter.end}`;
            return 'Histórico Global';
        };

        // COMPONENTE DE ÍCONO SEGURO PARA REACT
        const Icon = ({ name, className }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide) {
                    iconRef.current.innerHTML = `<i data-lucide="${name}" class="${className || ''}"></i>`;
                    window.lucide.createIcons({ root: iconRef.current });
                }
            }, [name, className]);
            return <span ref={iconRef} style={{ display: 'contents' }} />;
        };

        // ===== SISTEMA DE PERFILES (MÚLTIPLES NEGOCIOS) =====
        // Cada perfil (negocio) guarda su propia info bajo una llave de localStorage distinta,
        // así los datos de un emprendimiento nunca se mezclan con los de otro.
        const PROFILES_LIST_KEY = 'empresa_profiles_list';
        const ACTIVE_PROFILE_KEY = 'empresa_active_profile_id';
        const getProfileKey = (base, profileId) => `${base}__${profileId}`;

        function initializeProfileSystem() {
            let profiles = [];
            try { profiles = JSON.parse(localStorage.getItem(PROFILES_LIST_KEY)) || []; } catch (e) { profiles = []; }

            if (!profiles.length) {
                // Migración: si ya existían datos con el formato anterior (sin perfiles),
                // se conservan intactos dentro de un primer perfil por defecto.
                const legacyId = 'perfil_1';
                ['empresa_settings', 'empresa_products', 'empresa_sales', 'empresa_transfer_data'].forEach(key => {
                    const existing = localStorage.getItem(key);
                    if (existing !== null) localStorage.setItem(getProfileKey(key, legacyId), existing);
                });
                profiles = [{ id: legacyId, name: 'Mi Negocio' }];
                localStorage.setItem(PROFILES_LIST_KEY, JSON.stringify(profiles));
            }

            let activeId = localStorage.getItem(ACTIVE_PROFILE_KEY);
            if (!activeId || !profiles.find(p => p.id === activeId)) {
                activeId = profiles[0].id;
                localStorage.setItem(ACTIVE_PROFILE_KEY, activeId);
            }
            return { profiles, activeId };
        }

        const { profiles: initialProfilesList, activeId: initialActiveProfileId } = initializeProfileSystem();

        // Tarjeta de cuenta: cerrar sesión, estado de sincronización y actualizar manualmente
        function CuentaCard() {
            const [syncStatus, setSyncStatus] = useState('saved'); // pending | saving | saved | error
            const [refreshing, setRefreshing] = useState(false);
            const userEmail = (window.netlifyIdentity && window.netlifyIdentity.currentUser() && window.netlifyIdentity.currentUser().email) || '';

            useEffect(() => {
                const onSync = (e) => setSyncStatus(e.detail.status);
                window.addEventListener('cloud-sync', onSync);
                return () => window.removeEventListener('cloud-sync', onSync);
            }, []);

            const statusLabel = {
                pending: 'Cambios sin guardar todavía...',
                saving: 'Guardando en la nube...',
                saved: 'Todo guardado en la nube ✓',
                error: 'No se pudo guardar. Revisa tu conexión.',
            }[syncStatus];

            const statusColor = {
                pending: 'text-amber-500',
                saving: 'text-amber-500',
                saved: 'text-green-600',
                error: 'text-red-500',
            }[syncStatus];

            const handleRefresh = async () => {
                setRefreshing(true);
                await window.__pullFromCloud();
                window.location.reload();
            };

            return (
                <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                    <h2 className="text-2xl font-bold text-slate-700 flex items-center gap-2 mb-1">
                        <Icon name="cloud" className="text-primary" /> Cuenta
                    </h2>
                    {userEmail && <p className="text-xs text-slate-400 font-bold mb-4">{userEmail}</p>}
                    <p className={`text-xs font-bold mb-4 ${statusColor}`}>{statusLabel}</p>
                    <div className="flex flex-wrap gap-2">
                        <button
                            onClick={handleRefresh}
                            disabled={refreshing}
                            className="px-4 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest bg-slate-100 text-slate-600 disabled:opacity-50"
                        >
                            {refreshing ? 'Actualizando...' : 'Actualizar datos de otros dispositivos'}
                        </button>
                        <button
                            onClick={() => window.netlifyIdentity && window.netlifyIdentity.logout()}
                            className="px-4 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest bg-red-50 text-red-500"
                        >
                            Cerrar sesión
                        </button>
                    </div>
                </div>
            );
        }

        function App() {
            // Perfiles (Negocios)
            const [profiles, setProfiles] = useState(initialProfilesList);
            const [activeProfileId, setActiveProfileId] = useState(initialActiveProfileId);

            // Configuración
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem(getProfileKey('empresa_settings', initialActiveProfileId));
                return saved ? {...defaultSettings, ...JSON.parse(saved)} : defaultSettings;
            });

            useEffect(() => {
                localStorage.setItem(getProfileKey('empresa_settings', activeProfileId), JSON.stringify(settings));
                document.documentElement.style.setProperty('--primary', settings.primaryColor);
                document.documentElement.style.setProperty('--primary-glow', settings.primaryColor + '66');
            }, [settings, activeProfileId]);

            // Datos Base (con mapeo robusto para asegurar que category es array)
            const [products, setProducts] = useState(() => {
                const saved = localStorage.getItem(getProfileKey('empresa_products', initialActiveProfileId));
                if (saved) {
                    return JSON.parse(saved).map(p => ({...p, category: Array.isArray(p.category) ? p.category : (p.category ? [p.category] : [])}));
                }
                return genericProducts;
            });
            const [sales, setSales] = useState(() => {
                const saved = localStorage.getItem(getProfileKey('empresa_sales', initialActiveProfileId));
                return saved ? JSON.parse(saved) : genericSales;
            });
            const [transferData, setTransferData] = useState(() => {
                const saved = localStorage.getItem(getProfileKey('empresa_transfer_data', initialActiveProfileId));
                return saved ? JSON.parse(saved) : {banco:"Banco Genérico",cuenta:"1234 5678 9012 3456",clabe:"123456789012345678",titular:"Juan Pérez"};
            });

            useEffect(() => { localStorage.setItem(getProfileKey('empresa_products', activeProfileId), JSON.stringify(products)); }, [products, activeProfileId]);
            useEffect(() => { localStorage.setItem(getProfileKey('empresa_sales', activeProfileId), JSON.stringify(sales)); }, [sales, activeProfileId]);
            useEffect(() => { localStorage.setItem(getProfileKey('empresa_transfer_data', activeProfileId), JSON.stringify(transferData)); }, [transferData, activeProfileId]);

            // Persistencia de la lista de perfiles y el perfil activo
            useEffect(() => { localStorage.setItem(PROFILES_LIST_KEY, JSON.stringify(profiles)); }, [profiles]);
            useEffect(() => { localStorage.setItem(ACTIVE_PROFILE_KEY, activeProfileId); }, [activeProfileId]);

            // Utilidad de Renta dinámica y Activar/Desactivar Renta
            const hasRent = (settings.rentPercentage ?? 10) > 0;
            const getRentValue = (price) => hasRent ? price * ((settings.rentPercentage ?? 10) / 100) : 0;

            // UI Estados
            const [activeTab, setActiveTab] = useState('ventas');
            const [isAddingProduct, setIsAddingProduct] = useState(false);
            const [editingProductId, setEditingProductId] = useState(null);
            const [newProduct, setNewProduct] = useState({ name: '', category: settings.categories[0] ? [settings.categories[0].id] : [], cost: '', price: '', stock: '' });
            
            const [isCreatingSale, setIsCreatingSale] = useState(false);
            const [editingSaleId, setEditingSaleId] = useState(null);
            const [cart, setCart] = useState([]);
            const [paymentMethod, setPaymentMethod] = useState(settings.payments[0]?.id || '');
            const [selectedSaleReceipt, setSelectedSaleReceipt] = useState(null);
            const [saleToDelete, setSaleToDelete] = useState(null);
            const [productToDelete, setProductToDelete] = useState(null);
            const [isEditingTransfer, setIsEditingTransfer] = useState(false);
            const [copyStatus, setCopyStatus] = useState(false);
            const [saleDate, setSaleDate] = useState(() => new Date().toISOString().slice(0, 16));

            // Filtros Avanzados
            const [productsListFilter, setProductsListFilter] = useState(['todos']);
            const [productsStockSort, setProductsStockSort] = useState(null); // null | 'asc' | 'desc'
            const [salesProductFilter, setSalesProductFilter] = useState('todos');
            const [salesListFilter, setSalesListFilter] = useState(['todos']);
            const [salesPaymentFilter, setSalesPaymentFilter] = useState(['todos']);
            
            // Filtro de Fecha Universal
            const defaultDateFilter = { mode: 'global', value: '', start: '', end: '' };
            const [salesDateFilter, setSalesDateFilter] = useState(defaultDateFilter);
            const [reportDateFilter, setReportDateFilter] = useState(defaultDateFilter);
            
            const [reportCategoryFilter, setReportCategoryFilter] = useState(['todos']);
            const [reportPaymentFilter, setReportPaymentFilter] = useState(['todos']);

            // Estados del Perfil
            const [newCat, setNewCat] = useState({ name: '', color: '#f472b6', textColor: '#ffffff' });
            const [newPay, setNewPay] = useState({ name: '', color: '#eab308', textColor: '#ffffff' });
            const [newStat, setNewStat] = useState({ name: '', type: 'percentage', source: 'ventaBruta', source2: 'ventaBruta', value: '', paymentMethods: [] });
            const [editingStatId, setEditingStatId] = useState(null);
            const [editingDefaultStatId, setEditingDefaultStatId] = useState(null);
            const [defaultStatNameDraft, setDefaultStatNameDraft] = useState('');

            // Estados de Gestión de Perfiles (Negocios)
            const [newProfileName, setNewProfileName] = useState('');
            const [editingProfile, setEditingProfile] = useState(null);
            const [profileToDelete, setProfileToDelete] = useState(null);

            const formatMoney = (amount) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(amount || 0);

            const toggleFilter = (currentFilters, setFilters, value) => {
                if (!settings.allowMultiFilter) {
                    setFilters([value]);
                    return;
                }
                if (value === 'todos') {
                    setFilters(['todos']);
                } else {
                    let next = currentFilters.filter(f => f !== 'todos');
                    if (next.includes(value)) {
                        next = next.filter(f => f !== value);
                        if (next.length === 0) next = ['todos'];
                    } else {
                        next = [...next, value];
                    }
                    setFilters(next);
                }
            };

            // Cambia de negocio activo, cargando su propia información aislada
            const switchProfile = (profileId) => {
                if (profileId === activeProfileId) return;

                const loadedSettings = (() => {
                    const saved = localStorage.getItem(getProfileKey('empresa_settings', profileId));
                    return saved ? {...defaultSettings, ...JSON.parse(saved)} : defaultSettings;
                })();
                const loadedProducts = (() => {
                    const saved = localStorage.getItem(getProfileKey('empresa_products', profileId));
                    if (saved) return JSON.parse(saved).map(p => ({...p, category: Array.isArray(p.category) ? p.category : (p.category ? [p.category] : [])}));
                    return genericProducts;
                })();
                const loadedSales = (() => {
                    const saved = localStorage.getItem(getProfileKey('empresa_sales', profileId));
                    return saved ? JSON.parse(saved) : genericSales;
                })();
                const loadedTransfer = (() => {
                    const saved = localStorage.getItem(getProfileKey('empresa_transfer_data', profileId));
                    return saved ? JSON.parse(saved) : {banco:"Banco Genérico",cuenta:"1234 5678 9012 3456",clabe:"123456789012345678",titular:"Juan Pérez"};
                })();

                setActiveProfileId(profileId);
                setSettings(loadedSettings);
                setProducts(loadedProducts);
                setSales(loadedSales);
                setTransferData(loadedTransfer);

                // Reiniciar estados transitorios de UI para no arrastrar nada del negocio anterior
                setActiveTab('ventas');
                setCart([]);
                setIsCreatingSale(false);
                setEditingSaleId(null);
                setIsAddingProduct(false);
                setEditingProductId(null);
                setSelectedSaleReceipt(null);
                setSaleToDelete(null);
                setProductToDelete(null);
                setProductsListFilter(['todos']);
                setProductsStockSort(null);
                setSalesListFilter(['todos']);
                setSalesPaymentFilter(['todos']);
                setReportCategoryFilter(['todos']);
                setReportPaymentFilter(['todos']);
                setSalesDateFilter(defaultDateFilter);
                setReportDateFilter(defaultDateFilter);
                setEditingStatId(null);
                setEditingDefaultStatId(null);
                setNewStat({name:'', type:'percentage', source:'ventaBruta', source2:'ventaBruta', value:'', paymentMethods: []});
            };

            const createProfile = (name) => {
                const id = `perfil_${Date.now()}`;
                setProfiles(prev => [...prev, { id, name }]);
                switchProfile(id);
            };

            const confirmDeleteProfile = () => {
                if (!profileToDelete || profiles.length <= 1) { setProfileToDelete(null); return; }
                ['empresa_settings', 'empresa_products', 'empresa_sales', 'empresa_transfer_data'].forEach(k => localStorage.removeItem(getProfileKey(k, profileToDelete)));
                const remaining = profiles.filter(p => p.id !== profileToDelete);
                setProfiles(remaining);
                if (activeProfileId === profileToDelete) switchProfile(remaining[0].id);
                setProfileToDelete(null);
            };

            // Dinamismo de Estadísticas Principales basado en la renta
            const baseDefaultStats = useMemo(() => [
                { id: 'ventaBruta', name: 'Venta Bruta Total', color: 'text-primary' },
                { id: 'totalVentasNum', name: 'Núm. de Ventas', color: 'text-primary' },
                { id: 'items', name: 'Productos Vendidos', color: 'text-primary' },
                ...(hasRent ? [{ id: 'ventaSinRenta', name: 'Venta sin Renta', color: 'text-indigo-600' }] : []),
                { id: 'gananciaNeta', name: 'Ganancia Neta Libre', color: 'text-green-600' },
                { id: 'costoProduccion', name: 'Inversión Materiales', color: 'text-red-400' },
                ...(hasRent ? [{ id: 'renta', name: `Fondo Renta (${settings.rentPercentage ?? 10}%)`, color: 'text-orange-400' }] : [])
            ], [hasRent, settings.rentPercentage]);

            // Aplica los nombres personalizados (renombrados por el usuario) sobre las estadísticas automáticas
            const activeDefaultStats = useMemo(() => baseDefaultStats.map(s => ({
                ...s,
                name: (settings.statOverrides && settings.statOverrides[s.id] && settings.statOverrides[s.id].name) || s.name
            })), [baseDefaultStats, settings.statOverrides]);

            const availableSources = useMemo(() => {
                return [
                    ...activeDefaultStats,
                    ...settings.customStats.map(c => ({ id: c.id, name: c.name }))
                ];
            }, [activeDefaultStats, settings.customStats]);

            // Estructuras para Tablas Dinámicas
            const tableDisplayStats = activeDefaultStats.filter(s => !settings.hiddenStats.includes(s.id) && s.id !== 'totalVentasNum' && s.id !== 'items');
            const productCardStats = tableDisplayStats.filter(s => s.id !== 'ventaBruta');

            // Engine Dinámico de Estadísticas Unificado
            const getDynamicStatValue = (entityObj, statId, isCustom = false, customStat = null, isProductRow = false) => {
                const map = isProductRow ? {
                    ventaBruta: entityObj.revenue || 0,
                    costoProduccion: entityObj.cost || 0,
                    renta: entityObj.rent || 0,
                    gananciaNeta: entityObj.profit || 0,
                    items: entityObj.quantity || 0,
                    ventaSinRenta: entityObj.revenueNoRent || 0,
                    totalVentasNum: 1
                } : {
                    ventaBruta: entityObj.totalVenta || 0,
                    costoProduccion: entityObj.totalCosto || 0,
                    renta: entityObj.totalRenta || 0,
                    gananciaNeta: entityObj.totalGanancia || 0,
                    items: entityObj.totalItems || 0,
                    ventaSinRenta: (entityObj.totalVenta || 0) - (entityObj.totalRenta || 0),
                    totalVentasNum: 1
                };

                if (!isCustom) return map[statId];

                const evalMap = { ...map };
                settings.customStats.forEach(stat => {
                    const b1 = evalMap[stat.source] || 0;
                    const b2 = evalMap[stat.source2] || 0;
                    if (stat.type === 'percentage') evalMap[stat.id] = b1 * (parseFloat(stat.value) / 100);
                    else if (stat.type === 'fixed') evalMap[stat.id] = parseFloat(stat.value);
                    else if (stat.type === 'sum') evalMap[stat.id] = b1 + b2;
                    else if (stat.type === 'subtract') evalMap[stat.id] = b1 - b2;
                });
                return evalMap[customStat.id] || 0;
            };

            // Funciones de Eliminación
            const confirmDeleteSale = () => {
                if (saleToDelete) {
                    const sale = sales.find(s => s.id === saleToDelete);
                    if (sale) {
                        // Devolver el stock
                        setProducts(prevProducts => prevProducts.map(p => {
                            const item = sale.items.find(i => i.product.id === p.id);
                            if (item) return { ...p, stock: (p.stock || 0) + item.quantity };
                            return p;
                        }));
                    }
                    setSales(prev => prev.filter(s => s.id !== saleToDelete));
                    setSaleToDelete(null);
                }
            };

            const confirmDeleteProduct = () => {
                if (productToDelete) {
                    setProducts(prev => prev.filter(p => p.id !== productToDelete));
                    setProductToDelete(null);
                }
            };

            const copyToClipboard = () => {
                const text = `Hola! Estos son mis datos para el pago:\n\n*Titular:* ${transferData.titular}\n*Banco:* ${transferData.banco}\n*Cuenta/Tarjeta:* ${transferData.cuenta}\n*CLABE:* ${transferData.clabe}\n\n¡Gracias por apoyar a ${settings.companyName}! ✨`;
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopyStatus(true);
                    setTimeout(() => setCopyStatus(false), 2000);
                } catch (err) { console.error('Error copiando', err); }
                document.body.removeChild(textArea);
            };

            const getCatSettings = (id) => settings.categories.find(c => c.id === id) || { name: id, color: '#e2e8f0', textColor: '#475569' };
            const getPaySettings = (id) => settings.payments.find(p => p.id === id) || { name: id, color: '#e2e8f0', textColor: '#475569' };

            const handleLogoUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 400; 
                            const scaleSize = MAX_WIDTH / img.width;
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * scaleSize;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            setSettings(prev => ({...prev, logoUrl: canvas.toDataURL('image/png', 0.8)}));
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);
                }
            };

            const FilterButton = ({ id, current, label, type, onClick }) => {
                const isSelected = Array.isArray(current) ? current.includes(id) : current === id;
                const isAll = id === 'todos';
                let bg = isSelected ? (isAll ? settings.primaryColor : (type === 'cat' ? getCatSettings(id).color : getPaySettings(id).color)) : 'transparent';
                let color = isSelected ? (isAll ? '#fff' : (type === 'cat' ? getCatSettings(id).textColor : getPaySettings(id).textColor)) : '#94a3b8';
                
                return (
                    <button 
                        onClick={onClick}
                        style={{ backgroundColor: bg, color: color }}
                        className={`px-3 py-1.5 text-[10px] font-black uppercase rounded-lg transition-all ${!isSelected && 'hover:bg-slate-200'} shadow-sm`}
                    >
                        {label}
                    </button>
                );
            };

            const DateFilterSelector = ({ filter, setFilter, label }) => (
                <div className="flex-1 min-w-[200px]">
                    <label className="text-[10px] font-black uppercase text-slate-400 block mb-2 tracking-widest">{label}</label>
                    <div className="flex flex-col gap-2">
                        <div className="relative">
                            <select 
                                value={filter.mode} 
                                onChange={e => setFilter({...filter, mode: e.target.value})} 
                                className="w-full bg-slate-50 border border-slate-200 text-slate-700 font-bold p-3 rounded-xl outline-none focus:ring-2 focus:ring-primary appearance-none"
                            >
                                <option value="global">Global (Todo)</option>
                                <option value="day">Día Específico</option>
                                <option value="week">Semana</option>
                                <option value="month">Mes</option>
                                <option value="range">Rango de Fechas</option>
                            </select>
                            <Icon name="calendar" className="absolute right-3 top-3.5 w-4 h-4 text-slate-400 pointer-events-none" />
                        </div>
                        
                        {filter.mode === 'day' && <input type="date" value={filter.value} onChange={e => setFilter({...filter, value: e.target.value})} className="p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm font-bold w-full" />}
                        {filter.mode === 'week' && <input type="week" value={filter.value} onChange={e => setFilter({...filter, value: e.target.value})} className="p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm font-bold w-full" />}
                        {filter.mode === 'month' && <input type="month" value={filter.value} onChange={e => setFilter({...filter, value: e.target.value})} className="p-3 rounded-xl bg-slate-50 border border-slate-200 text-sm font-bold w-full" />}
                        {filter.mode === 'range' && (
                            <div className="flex items-center gap-2">
                                <input type="date" value={filter.start} onChange={e => setFilter({...filter, start: e.target.value})} className="p-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold w-full" />
                                <span className="text-slate-400 font-bold">-</span>
                                <input type="date" value={filter.end} onChange={e => setFilter({...filter, end: e.target.value})} className="p-2 rounded-xl bg-slate-50 border border-slate-200 text-xs font-bold w-full" />
                            </div>
                        )}
                    </div>
                </div>
            );

            const handleSaveSale = () => {
                if (cart.length === 0) return;
                
                const totals = cart.reduce((acc, item) => ({
                    venta: acc.venta + (item.product.price * item.quantity),
                    costo: acc.costo + (item.product.cost * item.quantity),
                    renta: acc.renta + ((item.product.rent ?? getRentValue(item.product.price)) * item.quantity),
                    ganancia: acc.ganancia + ((item.product.price - item.product.cost - (item.product.rent ?? getRentValue(item.product.price))) * item.quantity),
                    items: acc.items + item.quantity
                }), { venta: 0, costo: 0, renta: 0, ganancia: 0, items: 0 });

                let savedSale = null;
                const isoNow = new Date(saleDate);

                // ACTUALIZAR EL INVENTARIO/STOCK Y GUARDAR
                setProducts(prevProducts => {
                    const newProducts = prevProducts.map(p => {
                        let newStock = p.stock || 0;
                        
                        // Si estamos editando, primero revertimos el stock original de la venta
                        if (editingSaleId) {
                            const originalSale = sales.find(s => s.id === editingSaleId);
                            const origItem = originalSale?.items.find(i => i.product.id === p.id);
                            if (origItem) newStock += origItem.quantity;
                        }

                        // Luego restamos lo que esté actualmente en el carrito
                        const cartItem = cart.find(i => i.product.id === p.id);
                        if (cartItem) newStock -= cartItem.quantity;
                        
                        return { ...p, stock: newStock };
                    });
                    
                    return newProducts;
                });

                if (editingSaleId) {
                    const originalSale = sales.find(s => s.id === editingSaleId);
                    const updatedSale = {
                        date: isoNow.toLocaleString(),
                        isoDate: isoNow.toISOString(),
                        items: [...cart], paymentMethod, totalVenta: totals.venta, totalCosto: totals.costo, 
                        totalRenta: totals.renta, totalGanancia: totals.ganancia, totalItems: totals.items
                    };
                    setSales(prev => prev.map(s => s.id === editingSaleId ? { ...s, ...updatedSale } : s));
                    savedSale = { ...originalSale, ...updatedSale };
                    setEditingSaleId(null);
                } else {
                    const dd = String(isoNow.getDate()).padStart(2, '0');
                    const mm = String(isoNow.getMonth() + 1).padStart(2, '0');
                    const yy = String(isoNow.getFullYear()).slice(-2);
                    const prefix = `${dd}${mm}${yy}`;
                    
                    const todaysSalesCount = sales.filter(s => s.id.startsWith(prefix)).length;
                    const nextNum = todaysSalesCount + 1;
                    const saleId = `${prefix}${String(nextNum).padStart(3, '0')}`;

                    const newSale = { 
                        id: saleId, 
                        date: isoNow.toLocaleString(), 
                        isoDate: isoNow.toISOString(), 
                        items: [...cart], paymentMethod, totalVenta: totals.venta, totalCosto: totals.costo, 
                        totalRenta: totals.renta, totalGanancia: totals.ganancia, totalItems: totals.items 
                    };
                    setSales(prev => [newSale, ...prev]);
                    savedSale = newSale;
                }
                
                setCart([]);
                setIsCreatingSale(false);
                if (savedSale) setSelectedSaleReceipt(savedSale);
            };

            const filteredSalesList = useMemo(() => sales.filter(sale => {
                const matchDate = matchesDateFilter(sale.isoDate, sale.date, salesDateFilter);
                const matchCategory = salesListFilter.includes('todos') || sale.items.some(item => {
                    const cats = Array.isArray(item.product.category) ? item.product.category : [item.product.category];
                    return cats.some(c => salesListFilter.includes(c));
                });
                const matchPayment = salesPaymentFilter.includes('todos') || salesPaymentFilter.includes(sale.paymentMethod);
                return matchDate && matchCategory && matchPayment;
            }), [sales, salesDateFilter, salesListFilter, salesPaymentFilter]);

            const groupedSalesArray = useMemo(() => {
                const map = new Map();
                filteredSalesList.forEach(sale => {
                    const dateObj = sale.isoDate ? new Date(sale.isoDate) : parseDateFallback(sale.date);
                    const dateStr = dateObj.toLocaleDateString();
                    if (!map.has(dateStr)) map.set(dateStr, []);
                    map.get(dateStr).push(sale);
                });
                return Array.from(map.entries()).sort((a,b) => parseDateFallback(b[0]) - parseDateFallback(a[0])).map(([date, salesList]) => ({ date, sales: salesList }));
            }, [filteredSalesList]);

            // Calcula los totales base (ventaBruta, costo, renta, etc.) para un filtro de pago dado.
            // Se separó de calculateStats para poder recalcular una base distinta por cada
            // estadística personalizada cuando ésta restringe su propio método de pago.
            const calculateBaseStats = (dateFilt, payFilt, catFilt, minIsoDate = null) => {
                let s = { ventaBruta: 0, costoProduccion: 0, renta: 0, gananciaNeta: 0, items: 0, ventaSinRenta: 0, totalVentasNum: 0 };
                sales.forEach(sale => {
                    if (minIsoDate && sale.isoDate && sale.isoDate < minIsoDate) return;
                    if (!matchesDateFilter(sale.isoDate, sale.date, dateFilt)) return;
                    if (!payFilt.includes('todos') && !payFilt.includes(sale.paymentMethod)) return;
                    
                    let matchesCat = false;
                    sale.items.forEach(item => {
                        const itemCats = Array.isArray(item.product.category) ? item.product.category : [item.product.category];
                        if (catFilt.includes('todos') || itemCats.some(c => catFilt.includes(c))) {
                            matchesCat = true;
                            const currentRent = item.product.rent ?? getRentValue(item.product.price);
                            s.ventaBruta += item.product.price * item.quantity;
                            s.costoProduccion += item.product.cost * item.quantity;
                            s.renta += currentRent * item.quantity;
                            s.gananciaNeta += (item.product.price - item.product.cost - currentRent) * item.quantity;
                            s.items += item.quantity;
                            s.ventaSinRenta += (item.product.price - currentRent) * item.quantity;
                        }
                    });
                    if (matchesCat) s.totalVentasNum += 1;
                });
                return s;
            };

            // Calcula un mapa COMPLETO de valores (estadísticas base + todas las personalizadas ya resueltas)
            // para un filtro de pago dado. A diferencia de calculateBaseStats, este sí incluye los
            // valores de las demás estadísticas personalizadas, para que una estadística con método
            // de pago propio pueda usar correctamente a otra estadística personalizada como fuente
            // (antes esto se quedaba en $0 porque esa fuente no existía en la base recalculada).
            const calculateFullStatsMap = (dateFilt, payFilt, catFilt) => {
                const map = calculateBaseStats(dateFilt, payFilt, catFilt);
                settings.customStats.forEach(stat => {
                    const hasOwnPayFilter = Array.isArray(stat.paymentMethods) && stat.paymentMethods.length > 0;
                    const baseForStat = hasOwnPayFilter ? calculateFullStatsMap(dateFilt, stat.paymentMethods, catFilt) : map;

                    const base1 = baseForStat[stat.source] || 0;
                    const base2 = baseForStat[stat.source2] || 0;
                    let val = 0;
                    if (stat.type === 'percentage') val = base1 * (parseFloat(stat.value) / 100);
                    else if (stat.type === 'fixed') val = parseFloat(stat.value);
                    else if (stat.type === 'sum') val = base1 + base2;
                    else if (stat.type === 'subtract') val = base1 - base2;

                    map[stat.id] = val || 0;
                });
                return map;
            };

            const calculateStats = (dateFilt, payFilt, catFilt) => {
                const s = calculateBaseStats(dateFilt, payFilt, catFilt);
                const resultsMap = { ...s };

                const computedCustoms = settings.customStats.map(stat => {
                    // Si la estadística tiene métodos de pago propios, se recalcula la base
                    // usando SOLO esos métodos, sin importar el filtro de pago del reporte.
                    const hasOwnPayFilter = Array.isArray(stat.paymentMethods) && stat.paymentMethods.length > 0;
                    // Además, si la estadística tiene fecha de creación, su propia base (ventaBruta,
                    // costoProduccion, etc.) se recalcula excluyendo ventas anteriores a esa fecha,
                    // para que no afecte reportes de periodos previos a su creación. Las demás
                    // estadísticas personalizadas usadas como fuente conservan su propio cálculo ya hecho.
                    const cutoffBase = stat.createdAt
                        ? calculateBaseStats(dateFilt, hasOwnPayFilter ? stat.paymentMethods : payFilt, catFilt, stat.createdAt)
                        : (hasOwnPayFilter ? calculateFullStatsMap(dateFilt, stat.paymentMethods, catFilt) : null);
                    const baseForStat = cutoffBase ? { ...resultsMap, ...cutoffBase } : resultsMap;

                    const base1 = baseForStat[stat.source] || 0;
                    const base2 = baseForStat[stat.source2] || 0;
                    let val = 0;
                    if (stat.type === 'percentage') val = base1 * (parseFloat(stat.value) / 100);
                    else if (stat.type === 'fixed') val = parseFloat(stat.value);
                    else if (stat.type === 'sum') val = base1 + base2;
                    else if (stat.type === 'subtract') val = base1 - base2;

                    resultsMap[stat.id] = val; 
                    return { ...stat, calculated: val || 0 };
                });

                return { ...s, computedCustoms };
            };

            const stats = useMemo(() => calculateStats(reportDateFilter, reportPaymentFilter, reportCategoryFilter), [sales, reportDateFilter, reportPaymentFilter, reportCategoryFilter, settings]);
            
            const computeSoldProductsMap = (dateFilt, payFilt, catFilt, minIsoDate = null) => {
                const map = new Map();
                sales.forEach(sale => {
                    if (minIsoDate && sale.isoDate && sale.isoDate < minIsoDate) return;
                    if (!matchesDateFilter(sale.isoDate, sale.date, dateFilt)) return;
                    if (!payFilt.includes('todos') && !payFilt.includes(sale.paymentMethod)) return;

                    sale.items.forEach(item => {
                        const itemCats = Array.isArray(item.product.category) ? item.product.category : [item.product.category];
                        if (catFilt.includes('todos') || itemCats.some(c => catFilt.includes(c))) {
                            const pid = item.product.id;
                            const currentRent = item.product.rent ?? getRentValue(item.product.price);
                            
                            if (!map.has(pid)) {
                                map.set(pid, { id: pid, name: item.product.name, category: item.product.category, quantity: 0, revenue: 0, revenueNoRent: 0, cost: 0, rent: 0, profit: 0 });
                            }
                            const curr = map.get(pid);
                            curr.quantity += item.quantity;
                            curr.revenue += (item.product.price * item.quantity);
                            curr.revenueNoRent += ((item.product.price - currentRent) * item.quantity);
                            curr.cost += (item.product.cost * item.quantity);
                            curr.rent += (currentRent * item.quantity);
                            curr.profit += ((item.product.price - item.product.cost - currentRent) * item.quantity);
                        }
                    });
                });
                return map;
            };

            const soldProductsData = useMemo(() => {
                const map = computeSoldProductsMap(reportDateFilter, reportPaymentFilter, reportCategoryFilter);
                return Array.from(map.values()).sort((a, b) => b.quantity - a.quantity);
            }, [sales, reportDateFilter, reportPaymentFilter, reportCategoryFilter, settings]);

            // Para cada estadística personalizada con fecha de creación, un mapa de productos
            // calculado SOLO con ventas posteriores a esa fecha (para no inflar reportes de
            // periodos anteriores a que la estadística existiera).
            const soldProductsDataByStat = useMemo(() => {
                const cache = new Map();
                settings.customStats.forEach(cstat => {
                    if (cstat.createdAt) {
                        cache.set(cstat.id, computeSoldProductsMap(reportDateFilter, reportPaymentFilter, reportCategoryFilter, cstat.createdAt));
                    }
                });
                return cache;
            }, [sales, reportDateFilter, reportPaymentFilter, reportCategoryFilter, settings.customStats]);

            // Devuelve el valor formateado de una estadística personalizada para un producto de reporte,
            // o null si esa estadística no existía todavía cuando se hicieron las ventas de ese producto
            // en el periodo filtrado (en cuyo caso no debe sumarse ni mostrarse un número).
            const getProductCustomStatDisplay = (p, cstat) => {
                const cutoffMap = soldProductsDataByStat.get(cstat.id);
                if (!cutoffMap) return formatMoney(getDynamicStatValue(p, null, true, cstat, true));
                const restricted = cutoffMap.get(p.id);
                if (!restricted) return '—';
                return formatMoney(getDynamicStatValue(restricted, null, true, cstat, true));
            };

            // PDF
            const handleExportPDF = () => {
                const element = document.getElementById('pdf-export-container');
                const opt = {
                    margin: 10, filename: `Reporte_${settings.companyName.replace(/\s+/g,'_')}.pdf`,
                    image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
                };
                element.style.display = 'block';
                html2pdf().set(opt).from(element).save().then(() => { element.style.display = 'none'; });
            };

            const toggleHiddenStat = (statId) => {
                setSettings(prev => ({
                    ...prev,
                    hiddenStats: prev.hiddenStats.includes(statId) 
                        ? prev.hiddenStats.filter(id => id !== statId)
                        : [...prev.hiddenStats, statId]
                }));
            };

            // Oculta/muestra una estadística únicamente dentro de la sección de Reportes (no afecta Catálogo, Historial, Carrito ni Ventas)
            const toggleReportHiddenStat = (statId) => {
                setSettings(prev => ({
                    ...prev,
                    reportHiddenStats: (prev.reportHiddenStats || []).includes(statId)
                        ? prev.reportHiddenStats.filter(id => id !== statId)
                        : [...(prev.reportHiddenStats || []), statId]
                }));
            };

            // Edición de estadísticas personalizadas (carga sus datos en el formulario de creación)
            const startEditCustomStat = (cstat) => {
                setEditingDefaultStatId(null);
                setEditingStatId(cstat.id);
                setNewStat({ name: cstat.name, type: cstat.type, source: cstat.source, source2: cstat.source2, value: cstat.value, paymentMethods: cstat.paymentMethods || [] });
            };

            const cancelEditCustomStat = () => {
                setEditingStatId(null);
                setNewStat({ name: '', type: 'percentage', source: 'ventaBruta', source2: 'ventaBruta', value: '', paymentMethods: [] });
            };

            const saveCustomStat = () => {
                if (!isCustomStatValid) return;
                if (editingStatId) {
                    setSettings(prev => ({ ...prev, customStats: prev.customStats.map(c => c.id === editingStatId ? { ...newStat, id: editingStatId, createdAt: c.createdAt || new Date().toISOString() } : c) }));
                } else {
                    setSettings(prev => ({ ...prev, customStats: [...prev.customStats, { ...newStat, id: `custom_${Date.now()}`, createdAt: new Date().toISOString() }] }));
                }
                cancelEditCustomStat();
            };

            // Renombrar una estadística automática (el cálculo no cambia, solo su nombre visible)
            const startEditDefaultStatName = (stat) => {
                cancelEditCustomStat();
                setEditingDefaultStatId(stat.id);
                setDefaultStatNameDraft(stat.name);
            };

            const saveDefaultStatName = () => {
                if (!editingDefaultStatId) return;
                const trimmed = defaultStatNameDraft.trim();
                setSettings(prev => ({
                    ...prev,
                    statOverrides: { ...prev.statOverrides, [editingDefaultStatId]: { ...(prev.statOverrides?.[editingDefaultStatId] || {}), name: trimmed || undefined } }
                }));
                setEditingDefaultStatId(null);
                setDefaultStatNameDraft('');
            };

            const StatsDashboard = ({ statsData, title }) => (
                <div className="mb-6">
                    {title && <h3 className="text-sm font-black text-slate-400 uppercase tracking-widest mb-3 px-2">{title}</h3>}
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        {activeDefaultStats.filter(s => !settings.hiddenStats.includes(s.id) && !(settings.reportHiddenStats || []).includes(s.id)).map(def => (
                            <div key={def.id} className={def.id === 'ventaBruta' ? `bg-primary text-white p-6 rounded-[2rem] shadow-lg md:col-span-2 lg:col-span-1` : `bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100`}>
                                <p className={`${def.id === 'ventaBruta' ? 'opacity-80 text-[10px]' : 'text-slate-400 text-[10px]'} font-black uppercase tracking-widest mb-1`}>{def.name}</p>
                                <h3 className={`text-4xl font-black ${def.id !== 'ventaBruta' ? def.color : ''}`}>
                                    {def.id.includes('Num') || def.id === 'items' ? statsData[def.id] : formatMoney(statsData[def.id])}
                                </h3>
                            </div>
                        ))}

                        {statsData.computedCustoms.filter(c => !settings.hiddenStats.includes(c.id) && !(settings.reportHiddenStats || []).includes(c.id)).map((custom, idx) => (
                            <div key={`custom-${idx}`} className="bg-white p-6 rounded-[2rem] shadow-sm border border-primary/20 bg-primary/5">
                                <p className="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-1 flex items-center gap-1"><Icon name="zap" className="w-3 h-3 text-primary" /> {custom.name}</p>
                                <h3 className="text-3xl font-black text-slate-700">{formatMoney(custom.calculated)}</h3>
                            </div>
                        ))}
                    </div>
                </div>
            );

            const isDefaultLogo = !settings.logoUrl || settings.logoUrl === 'logo_blanco.png';
            
            // Validaciones para activar botones
            const isCustomStatValid = newStat.name.trim() !== '' && (['sum', 'subtract'].includes(newStat.type) || String(newStat.value).trim() !== '');
            const isCatValid = newCat.name.trim() !== '';
            const isPayValid = newPay.name.trim() !== '';
            const isProductValid = newProduct.name.trim() !== '' && String(newProduct.cost).trim() !== '' && String(newProduct.price).trim() !== '' && parseFloat(newProduct.price) > 0 && (Array.isArray(newProduct.category) && newProduct.category.length > 0) && String(newProduct.stock).trim() !== '' && parseInt(newProduct.stock) >= 0;

            return (
                <div className="min-h-screen pb-24">
                    <header className="bg-primary text-white p-6 shadow-md rounded-b-[2.5rem] transition-colors duration-500">
                        <div className="max-w-4xl mx-auto flex items-center justify-between">
                            <div>
                                <h1 className="text-3xl font-extrabold tracking-tight">{settings.companyName}</h1>
                                <p className="bg-white/20 inline-block px-3 py-1 rounded-full text-sm mt-2 font-medium">{settings.businessType}</p>
                            </div>
                            <div className="w-20 h-20 md:w-24 md:h-24 flex items-center justify-center">
                                <img src={settings.logoUrl || "logo_blanco.png"} alt="Logo" className={`w-full h-full object-contain ${isDefaultLogo ? 'header-logo' : ''}`} onError={(e) => { e.target.onerror = null; e.target.src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2L2 22h20L12 2z'/%3E%3C/svg%3E" }} />
                            </div>
                        </div>
                    </header>

                    {/* PLANTILLA EXPORTACIÓN PDF */}
                    <div id="pdf-export-container" style={{ display: 'none', padding: '20px', fontFamily: 'Plus Jakarta Sans, sans-serif' }}>
                        <div style={{ textAlign: 'center', marginBottom: '30px' }}>
                            <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', gap: '15px', marginBottom: '15px' }}>
                                <img src={settings.logoUrl || "logo_blanco.png"} alt="Logo" style={{ width: '60px', height: '60px', objectFit: 'contain', filter: isDefaultLogo ? 'brightness(0) invert(1)' : 'none', backgroundColor: isDefaultLogo ? settings.primaryColor : 'transparent', borderRadius: isDefaultLogo ? '50%' : '0', padding: isDefaultLogo ? '10px' : '0' }} onError={(e) => e.target.style.display='none'} />
                                <h1 style={{ color: settings.primaryColor, margin: '0', fontSize: '24px', fontWeight: '800' }}>{settings.companyName} - Reporte Integral</h1>
                            </div>
                            <p style={{ color: '#94a3b8', fontSize: '10px', marginTop: '5px' }}>
                                Filtro: {getFilterDateLabel(reportDateFilter)} | Generado: {new Date().toLocaleString()}
                            </p>
                        </div>
                        {/* Métricas de Reportes */}
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '10px', marginBottom: '30px' }}>
                            {activeDefaultStats.filter(s => !settings.hiddenStats.includes(s.id) && !(settings.reportHiddenStats || []).includes(s.id)).map(def => (
                                <div className="pdf-card" key={def.id}>
                                    <p style={{ fontSize: '8px', color: '#64748b', textTransform: 'uppercase' }}>{def.name}</p>
                                    <p style={{ fontSize: '16px', fontWeight: '800' }}>{def.id.includes('Num') || def.id === 'items' ? stats[def.id] : formatMoney(stats[def.id])}</p>
                                </div>
                            ))}
                            {stats.computedCustoms.filter(c => !settings.hiddenStats.includes(c.id) && !(settings.reportHiddenStats || []).includes(c.id)).map((custom, idx) => (
                                <div className="pdf-card" key={`pdf-custom-${idx}`}>
                                    <p style={{ fontSize: '8px', color: '#64748b', textTransform: 'uppercase' }}>{custom.name}</p>
                                    <p style={{ fontSize: '16px', fontWeight: '800' }}>{formatMoney(custom.calculated)}</p>
                                </div>
                            ))}
                        </div>
                        
                        {/* Desglose */}
                        <h3 style={{ fontSize: '14px', fontWeight: '800', marginTop: '20px', marginBottom: '10px', color: '#1e293b', borderBottom: '2px solid #f1f5f9', paddingBottom: '5px' }}>Desglose de Productos</h3>
                        <table className="pdf-table">
                            <thead>
                                <tr>
                                    <th>Cant.</th>
                                    <th>Producto / Categoría</th>
                                    {tableDisplayStats.map(s => <th key={s.id}>{s.name}</th>)}
                                    {settings.customStats.filter(s => !settings.hiddenStats.includes(s.id)).map(s => <th key={s.id}>{s.name}</th>)}
                                </tr>
                            </thead>
                            <tbody>
                                {soldProductsData.map(p => {
                                    const cats = Array.isArray(p.category) ? p.category : [p.category];
                                    return (
                                    <tr key={p.id}>
                                        <td style={{ fontWeight: '800' }}>{p.quantity}</td>
                                        <td>
                                            <div style={{ fontWeight: '700' }}>{p.name}</div>
                                            <div style={{ fontSize: '8px', color: '#94a3b8', textTransform: 'uppercase' }}>{cats.map(cId => getCatSettings(cId).name).join(', ')}</div>
                                        </td>
                                        {tableDisplayStats.map(stat => (
                                            <td key={stat.id} style={{color: stat.id==='gananciaNeta' ? '#16a34a' : stat.id==='costoProduccion' ? '#ef4444' : stat.id==='renta' ? '#ea580c' : stat.id==='ventaSinRenta' ? '#4f46e5' : 'inherit', fontWeight: '700'}}>
                                                {formatMoney(getDynamicStatValue(p, stat.id, false, null, true))}
                                            </td>
                                        ))}
                                        {settings.customStats.filter(cstat => !settings.hiddenStats.includes(cstat.id)).map(cstat => (
                                            <td key={cstat.id} style={{fontWeight: '700'}}>
                                                {getProductCustomStatDisplay(p, cstat)}
                                            </td>
                                        ))}
                                    </tr>
                                )})}
                            </tbody>
                        </table>
                    </div>

                    <main className="max-w-4xl mx-auto p-4 mt-6">
                        
                        {/* PERFIL */}
                        {activeTab === 'perfil' && (
                            <div className="space-y-6 animate-fade-in">
                                <CuentaCard />

                                <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                                    <h2 className="text-2xl font-bold text-slate-700 flex items-center gap-2 mb-4">
                                        <Icon name="briefcase" className="text-primary" /> Mis Negocios
                                    </h2>
                                    <p className="text-[10px] text-slate-400 mb-4 italic">Cada negocio guarda su propio catálogo, ventas y ajustes por separado. Toca uno para activarlo.</p>
                                    <div className="flex flex-wrap gap-2 mb-4">
                                        {profiles.map(p => (
                                            <div key={p.id} className={`flex items-center gap-2 pl-3 pr-1.5 py-1.5 rounded-xl text-xs font-bold shadow-sm transition-all ${p.id === activeProfileId ? 'bg-primary text-white' : 'bg-slate-100 text-slate-500'}`}>
                                                <button onClick={() => switchProfile(p.id)} className="flex items-center gap-1.5">
                                                    {p.id === activeProfileId && <Icon name="check" className="w-3.5 h-3.5" />}
                                                    {p.name}
                                                </button>
                                                <button onClick={() => { setEditingProfile(p); setNewProfileName(p.name); }} className={`p-1 rounded-md ${p.id === activeProfileId ? 'hover:bg-white/20' : 'hover:bg-slate-200'}`}><Icon name="pencil" className="w-3 h-3" /></button>
                                                {profiles.length > 1 && (
                                                    <button onClick={() => setProfileToDelete(p.id)} className={`p-1 rounded-md ${p.id === activeProfileId ? 'hover:bg-white/20' : 'hover:bg-slate-200'}`}><Icon name="x" className="w-3 h-3" /></button>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex flex-wrap gap-2 items-center">
                                        <input
                                            type="text"
                                            placeholder={editingProfile ? "Renombrar negocio" : "Nombre del nuevo negocio"}
                                            value={newProfileName}
                                            onChange={e => setNewProfileName(e.target.value)}
                                            className="flex-1 min-w-[180px] p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm font-bold outline-none focus:ring-2 focus:ring-primary"
                                        />
                                        <button
                                            disabled={!newProfileName.trim()}
                                            onClick={() => {
                                                const name = newProfileName.trim();
                                                if (!name) return;
                                                if (editingProfile) {
                                                    setProfiles(prev => prev.map(p => p.id === editingProfile.id ? {...p, name} : p));
                                                    setEditingProfile(null);
                                                } else {
                                                    createProfile(name);
                                                }
                                                setNewProfileName('');
                                            }}
                                            className={`px-4 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest transition-all ${newProfileName.trim() ? 'bg-primary text-white shadow-md shadow-primary-glow' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}
                                        >
                                            {editingProfile ? 'Guardar' : 'Crear'}
                                        </button>
                                        {editingProfile && (
                                            <button onClick={() => { setEditingProfile(null); setNewProfileName(''); }} className="bg-slate-200 text-slate-600 px-3 py-2.5 rounded-xl font-bold"><Icon name="x" className="w-4 h-4" /></button>
                                        )}
                                    </div>
                                </div>

                                <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100">
                                    <h2 className="text-2xl font-bold text-slate-700 flex items-center gap-2 mb-6">
                                        <Icon name="user" className="text-primary" /> Perfil & Ajustes
                                    </h2>
                                    
                                    <div className="space-y-6">
                                        <div className="border-b border-slate-100 pb-6">
                                            <h3 className="text-sm font-black text-slate-400 uppercase tracking-widest mb-4">Comportamiento General</h3>
                                            <label className="flex items-center gap-4 cursor-pointer p-3 hover:bg-slate-50 rounded-2xl transition-colors border border-transparent hover:border-slate-100">
                                                <div className={`relative w-12 h-6 rounded-full transition-colors ${settings.allowMultiFilter ? 'bg-primary' : 'bg-slate-200'}`}>
                                                    <div className={`absolute top-1 left-1 bg-white w-4 h-4 rounded-full transition-transform ${settings.allowMultiFilter ? 'translate-x-6' : ''}`}></div>
                                                </div>
                                                <div className="flex-1">
                                                    <span className="text-sm font-bold text-slate-700 block">Filtros Múltiples</span>
                                                    <span className="text-xs text-slate-400 leading-tight block mt-0.5">Permite seleccionar varias categorías o métodos de pago a la vez.</span>
                                                </div>
                                                <input 
                                                    type="checkbox" 
                                                    className="hidden" 
                                                    checked={!!settings.allowMultiFilter}
                                                    onChange={(e) => {
                                                        setSettings({...settings, allowMultiFilter: e.target.checked});
                                                        setProductsListFilter(['todos']); setSalesListFilter(['todos']); setSalesPaymentFilter(['todos']); setReportCategoryFilter(['todos']); setReportPaymentFilter(['todos']);
                                                    }} 
                                                />
                                            </label>
                                        </div>

                                        <div>
                                            <h3 className="text-sm font-black text-slate-400 uppercase tracking-widest mb-3">Información General</h3>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 uppercase mb-1 block">Nombre de Empresa</label>
                                                    <input type="text" value={settings.companyName} onChange={e => setSettings({...settings, companyName: e.target.value})} className="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-primary font-bold" />
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 uppercase mb-1 block">Subtítulo / Tipo</label>
                                                    <input type="text" value={settings.businessType} onChange={e => setSettings({...settings, businessType: e.target.value})} className="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-primary font-bold" />
                                                </div>
                                                <div className="md:col-span-2">
                                                    <label className="text-xs font-bold text-slate-400 uppercase mb-1 block">Logo de la Empresa</label>
                                                    <div className="flex flex-col sm:flex-row gap-2">
