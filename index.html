                                                        <input type="text" value={settings.logoUrl} onChange={e => setSettings({...settings, logoUrl: e.target.value})} className="flex-1 p-3 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-primary font-bold" placeholder="URL de la imagen (https://...)" />
                                                        <div className="relative overflow-hidden bg-primary text-white p-3 rounded-xl font-bold text-center cursor-pointer hover:opacity-90 transition-opacity">
                                                            <span className="flex items-center justify-center gap-2"><Icon name="upload" className="w-4 h-4" /> Subir Archivo</span>
                                                            <input type="file" accept="image/*" onChange={handleLogoUpload} className="absolute inset-0 opacity-0 cursor-pointer" />
                                                        </div>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 uppercase mb-1 block">Color Principal</label>
                                                    <div className="flex gap-2">
                                                        <input type="color" value={settings.primaryColor} onChange={e => setSettings({...settings, primaryColor: e.target.value})} className="w-12 h-12 rounded-xl cursor-pointer" />
                                                        <input type="text" value={settings.primaryColor} onChange={e => setSettings({...settings, primaryColor: e.target.value})} className="flex-1 p-3 rounded-xl bg-slate-50 border border-slate-200 outline-none font-bold" />
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-xs font-bold text-slate-400 uppercase mb-1 block">Fondo de Renta (%) <span className="text-[9px] font-normal lowercase">(Pon 0 para ocultar)</span></label>
                                                    <input type="number" min="0" max="100" value={settings.rentPercentage ?? 10} onChange={e => setSettings({...settings, rentPercentage: parseFloat(e.target.value) || 0})} className="w-full p-3 rounded-xl bg-slate-50 border border-slate-200 outline-none focus:ring-2 focus:ring-primary font-bold" placeholder="Ej. 10 para 10%" />
                                                </div>
                                            </div>
                                        </div>

                                        <div className="border-t border-slate-100 pt-6">
                                            <h3 className="text-sm font-black text-slate-400 uppercase tracking-widest mb-3">Categorías de Producto</h3>
                                            <p className="text-[10px] text-slate-400 mb-4 italic">Haz clic en una categoría para editarla.</p>
                                            <div className="flex flex-wrap gap-2 mb-4">
                                                {settings.categories.map(cat => (
                                                    <div key={cat.id} onClick={() => setNewCat(cat)} style={{backgroundColor: cat.color, color: cat.textColor}} className="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm cursor-pointer hover:scale-105 transition-transform">
                                                        {cat.name}
                                                        <button onClick={(e) => { e.stopPropagation(); setSettings({...settings, categories: settings.categories.filter(c => c.id !== cat.id)}); }} className="opacity-50 hover:opacity-100"><Icon name="x" className="w-3 h-3" /></button>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="flex flex-wrap gap-2 items-end">
                                                <div className="flex-1 min-w-[150px]">
                                                    <input type="text" placeholder="Nombre de categoría" value={newCat.name} onChange={e => setNewCat({...newCat, name: e.target.value, id: newCat.id || e.target.value.toLowerCase().replace(/\s+/g,'-')})} className="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm font-bold outline-none focus:ring-2 focus:ring-primary" />
                                                </div>
                                                <div className="flex gap-2">
                                                    <div>
                                                        <label className="text-[9px] font-bold text-slate-400 block mb-1">Fondo</label>
                                                        <div className="flex items-center gap-1">
                                                            <input type="color" value={newCat.color} onChange={e => setNewCat({...newCat, color: e.target.value})} className="w-8 h-8 rounded cursor-pointer" />
                                                            <input type="text" value={newCat.color} onChange={e => setNewCat({...newCat, color: e.target.value})} className="w-16 p-2 rounded-lg bg-slate-50 border border-slate-200 text-xs font-bold outline-none uppercase" />
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <label className="text-[9px] font-bold text-slate-400 block mb-1">Texto</label>
                                                        <div className="flex items-center gap-1">
                                                            <input type="color" value={newCat.textColor} onChange={e => setNewCat({...newCat, textColor: e.target.value})} className="w-8 h-8 rounded cursor-pointer" />
                                                            <input type="text" value={newCat.textColor} onChange={e => setNewCat({...newCat, textColor: e.target.value})} className="w-16 p-2 rounded-lg bg-slate-50 border border-slate-200 text-xs font-bold outline-none uppercase" />
                                                        </div>
                                                    </div>
                                                </div>
                                                <button 
                                                    disabled={!isCatValid}
                                                    onClick={() => { 
                                                    if(isCatValid) { 
                                                        const exists = settings.categories.find(c => c.id === newCat.id);
                                                        if (exists) {
                                                            setSettings({...settings, categories: settings.categories.map(c => c.id === newCat.id ? newCat : c)});
                                                        } else {
                                                            setSettings({...settings, categories: [...settings.categories, newCat]}); 
                                                        }
                                                        setNewCat({name:'', id:'', color:'#f472b6', textColor:'#ffffff'}); 
                                                    } 
                                                }} className={`px-4 py-2.5 rounded-xl font-bold text-xs transition-all ${isCatValid ? 'bg-primary text-white shadow-md shadow-primary-glow' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                                    {settings.categories.find(c => c.id === newCat.id) ? 'Actualizar' : 'Añadir'}
                                                </button>
                                                {settings.categories.find(c => c.id === newCat.id) && (
                                                    <button onClick={() => setNewCat({name:'', id:'', color:'#f472b6', textColor:'#ffffff'})} className="bg-slate-200 text-slate-600 px-3 py-2.5 rounded-xl font-bold"><Icon name="x" className="w-4 h-4" /></button>
                                                )}
                                            </div>
                                        </div>

                                        <div className="border-t border-slate-100 pt-6">
                                            <h3 className="text-sm font-black text-slate-400 uppercase tracking-widest mb-3">Métodos de Pago</h3>
                                            <p className="text-[10px] text-slate-400 mb-4 italic">Haz clic en un método para editarlo.</p>
                                            <div className="flex flex-wrap gap-2 mb-4">
                                                {settings.payments.map(pay => (
                                                    <div key={pay.id} onClick={() => setNewPay(pay)} style={{backgroundColor: pay.color, color: pay.textColor}} className="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold shadow-sm cursor-pointer hover:scale-105 transition-transform">
                                                        {pay.name}
                                                        <button onClick={(e) => { e.stopPropagation(); setSettings({...settings, payments: settings.payments.filter(p => p.id !== pay.id)}); }} className="opacity-50 hover:opacity-100"><Icon name="x" className="w-3 h-3" /></button>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="flex flex-wrap gap-2 items-end">
                                                <div className="flex-1 min-w-[150px]">
                                                    <input type="text" placeholder="Nombre del método" value={newPay.name} onChange={e => setNewPay({...newPay, name: e.target.value, id: newPay.id || e.target.value.toLowerCase().replace(/\s+/g,'-')})} className="w-full p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-sm font-bold outline-none focus:ring-2 focus:ring-primary" />
                                                </div>
                                                <div className="flex gap-2">
                                                    <div>
                                                        <label className="text-[9px] font-bold text-slate-400 block mb-1">Fondo</label>
                                                        <div className="flex items-center gap-1">
                                                            <input type="color" value={newPay.color} onChange={e => setNewPay({...newPay, color: e.target.value})} className="w-8 h-8 rounded cursor-pointer" />
                                                            <input type="text" value={newPay.color} onChange={e => setNewPay({...newPay, color: e.target.value})} className="w-16 p-2 rounded-lg bg-slate-50 border border-slate-200 text-xs font-bold outline-none uppercase" />
                                                        </div>
                                                    </div>
                                                    <div>
                                                        <label className="text-[9px] font-bold text-slate-400 block mb-1">Texto</label>
                                                        <div className="flex items-center gap-1">
                                                            <input type="color" value={newPay.textColor} onChange={e => setNewPay({...newPay, textColor: e.target.value})} className="w-8 h-8 rounded cursor-pointer" />
                                                            <input type="text" value={newPay.textColor} onChange={e => setNewPay({...newPay, textColor: e.target.value})} className="w-16 p-2 rounded-lg bg-slate-50 border border-slate-200 text-xs font-bold outline-none uppercase" />
                                                        </div>
                                                    </div>
                                                </div>
                                                <button 
                                                    disabled={!isPayValid}
                                                    onClick={() => { 
                                                    if(isPayValid) { 
                                                        const exists = settings.payments.find(p => p.id === newPay.id);
                                                        if (exists) {
                                                            setSettings({...settings, payments: settings.payments.map(p => p.id === newPay.id ? newPay : p)});
                                                        } else {
                                                            setSettings({...settings, payments: [...settings.payments, newPay]}); 
                                                        }
                                                        setNewPay({name:'', id:'', color:'#eab308', textColor:'#ffffff'}); 
                                                    } 
                                                }} className={`px-4 py-2.5 rounded-xl font-bold text-xs transition-all ${isPayValid ? 'bg-primary text-white shadow-md shadow-primary-glow' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                                    {settings.payments.find(p => p.id === newPay.id) ? 'Actualizar' : 'Añadir'}
                                                </button>
                                                {settings.payments.find(p => p.id === newPay.id) && (
                                                    <button onClick={() => setNewPay({name:'', id:'', color:'#eab308', textColor:'#ffffff'})} className="bg-slate-200 text-slate-600 px-3 py-2.5 rounded-xl font-bold"><Icon name="x" className="w-4 h-4" /></button>
                                                )}
                                            </div>
                                        </div>

                                        <div className="border-t border-slate-100 pt-6">
                                            <h3 className="text-sm font-black text-slate-400 uppercase tracking-widest mb-3">Estadísticas Activas</h3>
                                            <p className="text-[10px] text-slate-400 mb-1 italic">Incluye tanto las automáticas de la app como las personalizadas. Puedes editarlas (incluidas las automáticas), ocultarlas por completo, o solo ocultarlas de Reportes.</p>
                                            <div className="flex flex-wrap gap-3 mb-4 text-[9px] font-bold text-slate-400 uppercase">
                                                <span className="flex items-center gap-1"><Icon name="eye" className="w-3 h-3" /> Ver/ocultar en todo</span>
                                                <span className="flex items-center gap-1"><Icon name="pie-chart" className="w-3 h-3" /> Ver/ocultar en Reportes</span>
                                                <span className="flex items-center gap-1"><Icon name="pencil" className="w-3 h-3" /> Editar</span>
                                            </div>

                                            <div className="space-y-2 mb-6">
                                                {[...activeDefaultStats, ...settings.customStats].map(stat => {
                                                    const isDefaultStat = activeDefaultStats.some(d => d.id === stat.id);
                                                    const isHiddenGlobal = settings.hiddenStats.includes(stat.id);
                                                    const isHiddenReport = (settings.reportHiddenStats || []).includes(stat.id);
                                                    const isRenamingThis = editingDefaultStatId === stat.id;
                                                    const isEditingThisCustom = editingStatId === stat.id;
                                                    return (
                                                        <div key={stat.id} className={`flex items-center gap-1.5 rounded-xl p-2 border ${isEditingThisCustom ? 'bg-primary/5 border-primary/30' : 'bg-slate-50 border-slate-200'}`}>
                                                            {isRenamingThis ? (
                                                                <input
                                                                    type="text"
                                                                    autoFocus
                                                                    value={defaultStatNameDraft}
                                                                    onChange={e => setDefaultStatNameDraft(e.target.value)}
                                                                    className="flex-1 min-w-0 p-1.5 rounded-lg bg-white border border-slate-200 text-xs font-bold outline-none focus:ring-2 focus:ring-primary"
                                                                />
                                                            ) : (
                                                                <span className="flex-1 min-w-0 text-xs font-bold text-slate-700 truncate">
                                                                    {!isDefaultStat && <Icon name="zap" className="w-3 h-3 inline mr-1 text-primary" />}
                                                                    {stat.name}
                                                                    {!isDefaultStat && (
                                                                        <span className="text-slate-400 font-normal normal-case">
                                                                            {stat.type === 'percentage' ? ` (${stat.value}% de ${availableSources.find(s=>s.id===stat.source)?.name})` : ''}
                                                                            {stat.type === 'fixed' ? ` (Fijo: $${stat.value})` : ''}
                                                                            {stat.type === 'sum' ? ` (Suma)` : ''}
                                                                            {stat.type === 'subtract' ? ` (Resta)` : ''}
                                                                            {Array.isArray(stat.paymentMethods) && stat.paymentMethods.length > 0 ? ` · Solo: ${settings.payments.filter(p => stat.paymentMethods.includes(p.id)).map(p => p.name).join(', ')}` : ''}
                                                                        </span>
                                                                    )}
                                                                </span>
                                                            )}

                                                            {isRenamingThis ? (
                                                                <>
                                                                    <button onClick={saveDefaultStatName} className="p-1.5 rounded-lg bg-primary text-white shrink-0"><Icon name="check" className="w-3.5 h-3.5" /></button>
                                                                    <button onClick={() => { setEditingDefaultStatId(null); setDefaultStatNameDraft(''); }} className="p-1.5 rounded-lg bg-slate-200 text-slate-500 shrink-0"><Icon name="x" className="w-3.5 h-3.5" /></button>
                                                                </>
                                                            ) : (
                                                                <>
                                                                    <button onClick={() => toggleHiddenStat(stat.id)} title="Mostrar/ocultar en toda la app" className={`p-1.5 rounded-lg shrink-0 ${isHiddenGlobal ? 'bg-slate-200 text-slate-400' : 'bg-primary/10 text-primary'}`}>
                                                                        <Icon name={isHiddenGlobal ? "eye-off" : "eye"} className="w-3.5 h-3.5" />
                                                                    </button>
                                                                    <button onClick={() => toggleReportHiddenStat(stat.id)} title="Mostrar/ocultar en Reportes" className={`p-1.5 rounded-lg shrink-0 ${isHiddenReport ? 'bg-slate-200 text-slate-400' : 'bg-indigo-100 text-indigo-500'}`}>
                                                                        <Icon name="pie-chart" className="w-3.5 h-3.5" />
                                                                    </button>
                                                                    <button onClick={() => isDefaultStat ? startEditDefaultStatName(stat) : startEditCustomStat(stat)} className={`p-1.5 rounded-lg shrink-0 ${isEditingThisCustom ? 'bg-primary text-white' : 'bg-slate-100 text-slate-400 hover:text-primary'}`}>
                                                                        <Icon name="pencil" className="w-3.5 h-3.5" />
                                                                    </button>
                                                                    {!isDefaultStat && (
                                                                        <button onClick={() => { if (editingStatId === stat.id) cancelEditCustomStat(); setSettings({...settings, customStats: settings.customStats.filter(c => c.id !== stat.id)}); }} className="p-1.5 rounded-lg bg-red-50 text-red-400 hover:bg-red-100 shrink-0"><Icon name="trash" className="w-3.5 h-3.5" /></button>
                                                                    )}
                                                                </>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                            
                                            <h4 className="text-xs font-bold text-slate-600 mb-2">{editingStatId ? 'Editar Estadística Personalizada' : 'Crear Estadística Personalizada'}</h4>
                                            <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                                                <input type="text" placeholder="Nombre (Ej. Impuestos 16%)" value={newStat.name} onChange={e => setNewStat({...newStat, name: e.target.value})} className="w-full p-2.5 rounded-xl bg-white border border-slate-200 text-sm font-bold outline-none focus:ring-2 focus:ring-primary" />
                                                
                                                <div className="flex flex-col gap-2">
                                                    <div className="flex gap-2">
                                                        <select value={newStat.type} onChange={e => setNewStat({...newStat, type: e.target.value})} className="w-1/3 p-2.5 rounded-xl bg-white border border-slate-200 text-xs font-bold outline-none">
                                                            <option value="percentage">% Porcentaje</option>
                                                            <option value="fixed">Fijo ($)</option>
                                                            <option value="sum">Suma (+)</option>
                                                            <option value="subtract">Resta (-)</option>
                                                        </select>
                                                        {['percentage', 'fixed'].includes(newStat.type) && (
                                                            <input type="number" placeholder="Valor numérico" value={newStat.value} onChange={e => setNewStat({...newStat, value: e.target.value})} className="w-2/3 p-2.5 rounded-xl bg-white border border-slate-200 text-sm font-bold outline-none" />
                                                        )}
                                                    </div>

                                                    {['percentage', 'fixed'].includes(newStat.type) ? (
                                                        <div className="flex gap-2 items-center">
                                                            <span className="text-xs font-bold text-slate-400">De:</span>
                                                            <select value={newStat.source} onChange={e => setNewStat({...newStat, source: e.target.value})} className="flex-1 p-2.5 rounded-xl bg-white border border-slate-200 text-xs font-bold outline-none">
                                                                {availableSources.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                                            </select>
                                                        </div>
                                                    ) : (
                                                        <div className="flex gap-2 items-center">
                                                            <select value={newStat.source} onChange={e => setNewStat({...newStat, source: e.target.value})} className="flex-1 p-2.5 rounded-xl bg-white border border-slate-200 text-xs font-bold outline-none">
                                                                {availableSources.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                                            </select>
                                                            <span className="text-xs font-bold text-slate-400">{newStat.type === 'sum' ? '+' : '-'}</span>
                                                            <select value={newStat.source2} onChange={e => setNewStat({...newStat, source2: e.target.value})} className="flex-1 p-2.5 rounded-xl bg-white border border-slate-200 text-xs font-bold outline-none">
                                                                {availableSources.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                                                            </select>
                                                        </div>
                                                    )}
                                                </div>

                                                <div className="border-t border-slate-200 pt-3">
                                                    <span className="text-xs font-bold text-slate-400 block mb-2">Aplicar solo a método(s) de pago:</span>
                                                    <div className="flex flex-wrap gap-2">
                                                        <button
                                                            onClick={() => setNewStat({...newStat, paymentMethods: []})}
                                                            style={(!newStat.paymentMethods || newStat.paymentMethods.length === 0) ? {backgroundColor: settings.primaryColor, color: '#fff'} : {}}
                                                            className={`px-3 py-1.5 text-[10px] font-black uppercase rounded-lg transition-all shadow-sm ${(!newStat.paymentMethods || newStat.paymentMethods.length === 0) ? '' : 'bg-white text-slate-400 hover:bg-slate-200'}`}
                                                        >
                                                            Todos
                                                        </button>
                                                        {settings.payments.map(pay => {
                                                            const isSel = (newStat.paymentMethods || []).includes(pay.id);
                                                            return (
                                                                <button
                                                                    key={pay.id}
                                                                    onClick={() => {
                                                                        const curr = newStat.paymentMethods || [];
                                                                        const next = curr.includes(pay.id) ? curr.filter(id => id !== pay.id) : [...curr, pay.id];
                                                                        setNewStat({...newStat, paymentMethods: next});
                                                                    }}
                                                                    style={isSel ? {backgroundColor: pay.color, color: pay.textColor} : {}}
                                                                    className={`px-3 py-1.5 text-[10px] font-black uppercase rounded-lg transition-all shadow-sm ${isSel ? '' : 'bg-white text-slate-400 hover:bg-slate-200'}`}
                                                                >
                                                                    {pay.name}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                                
                                                <div className="flex gap-2 mt-2">
                                                    <button 
                                                        disabled={!isCustomStatValid}
                                                        onClick={saveCustomStat}
                                                        className={`flex-1 transition-all p-2.5 rounded-xl font-bold text-xs uppercase tracking-widest ${isCustomStatValid ? 'bg-primary text-white shadow-lg shadow-primary-glow' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                                        {editingStatId ? 'Actualizar Estadística' : 'Añadir Estadística'}
                                                    </button>
                                                    {editingStatId && (
                                                        <button onClick={cancelEditCustomStat} className="px-4 py-2.5 rounded-xl font-bold text-xs uppercase tracking-widest bg-slate-200 text-slate-500">
                                                            Cancelar
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* PRODUCTOS */}
                        {activeTab === 'productos' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-2xl font-bold text-slate-700 flex items-center gap-2">
                                            <Icon name="package" className="text-primary" /> Catálogo
                                        </h2>
                                        <button 
                                            onClick={() => { setIsAddingProduct(!isAddingProduct); setNewProduct({ name: '', category: settings.categories[0] ? [settings.categories[0].id] : [], cost: '', price: '', stock: '' }); setEditingProductId(null); }} 
                                            className={`flex items-center gap-2 px-5 py-2.5 rounded-2xl font-bold transition-all shadow-md ${isAddingProduct ? 'bg-slate-100 text-slate-500' : 'bg-primary text-white shadow-primary-glow'}`}
                                        >
                                            {isAddingProduct ? <span className="flex items-center gap-2"><Icon name="x" className="w-4 h-4" /> Cerrar</span> : <span className="flex items-center gap-2"><Icon name="plus" className="w-4 h-4" /> Agregar</span>}
                                        </button>
                                    </div>
                                    
                                    <div className="flex flex-wrap items-center gap-2 justify-between">
                                        <div className="flex flex-wrap gap-1 bg-slate-100 p-1 rounded-xl w-fit max-w-full">
                                            <FilterButton id="todos" current={productsListFilter} label="Todos" type="cat" onClick={() => toggleFilter(productsListFilter, setProductsListFilter, 'todos')} />
                                            {settings.categories.map(cat => (
                                                <FilterButton key={cat.id} id={cat.id} current={productsListFilter} label={cat.name} type="cat" onClick={() => toggleFilter(productsListFilter, setProductsListFilter, cat.id)} />
                                            ))}
                                        </div>
                                        <div className="flex items-center gap-1 bg-slate-100 p-1 rounded-xl w-fit">
                                            <span className="text-[9px] font-black uppercase text-slate-400 pl-2 pr-1">Stock:</span>
                                            <button
                                                onClick={() => setProductsStockSort(productsStockSort === 'asc' ? null : 'asc')}
                                                title="Ordenar de menor a mayor stock"
                                                className={`px-2.5 py-1.5 rounded-lg transition-all flex items-center gap-1 text-[10px] font-black uppercase ${productsStockSort === 'asc' ? 'bg-primary text-white shadow-sm' : 'text-slate-400 hover:bg-slate-200'}`}
                                            >
                                                <Icon name="arrow-up" className="w-3 h-3" /> Menor
                                            </button>
                                            <button
                                                onClick={() => setProductsStockSort(productsStockSort === 'desc' ? null : 'desc')}
                                                title="Ordenar de mayor a menor stock"
                                                className={`px-2.5 py-1.5 rounded-lg transition-all flex items-center gap-1 text-[10px] font-black uppercase ${productsStockSort === 'desc' ? 'bg-primary text-white shadow-sm' : 'text-slate-400 hover:bg-slate-200'}`}
                                            >
                                                <Icon name="arrow-down" className="w-3 h-3" /> Mayor
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {isAddingProduct && (
                                    <div className="bg-white p-6 rounded-[2rem] shadow-md border border-primary/30">
                                        <h3 className="text-sm font-bold text-primary uppercase mb-4">{editingProductId ? 'Editar Producto' : 'Nuevo Producto'}</h3>
                                        <form onSubmit={(e) => {
                                            e.preventDefault();
                                            if (!newProduct.name.trim()) return;
                                            const cost = parseFloat(newProduct.cost) || 0;
                                            const price = parseFloat(newProduct.price) || 0;
                                            const stock = parseInt(newProduct.stock) || 0;
                                            if (price <= 0) return;
                                            const rent = getRentValue(price);
                                            const profit = price - cost - rent;
                                            if (editingProductId) {
                                                setProducts(prev => prev.map(p => p.id === editingProductId ? { ...p, name: newProduct.name.trim(), category: newProduct.category, cost, price, rent, profit, stock } : p));
                                                setEditingProductId(null);
                                            } else {
                                                setProducts(prev => [{ id: Date.now().toString(), name: newProduct.name.trim(), category: newProduct.category || (settings.categories[0] ? [settings.categories[0].id] : []), cost, price, rent, profit, stock }, ...prev]);
                                            }
                                            setNewProduct({ name: '', category: settings.categories[0] ? [settings.categories[0].id] : [], cost: '', price: '', stock: '' });
                                            setIsAddingProduct(false);
                                        }} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="md:col-span-2">
                                                <label className="text-xs font-bold text-slate-400 uppercase mb-1 block">Nombre</label>
                                                <input type="text" required value={newProduct.name} onChange={e => setNewProduct({...newProduct, name: e.target.value})} className="w-full p-3 rounded-2xl bg-slate-50 ring-1 ring-slate-200 outline-none focus:ring-2 focus:ring-primary" placeholder="Ej. Tulipán Azul" />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="text-xs font-bold text-slate-400 uppercase mb-1 block">Categorías (Puedes seleccionar varias)</label>
                                                <div className="flex flex-wrap gap-2">
                                                    {settings.categories.map(c => {
                                                        const isSelected = Array.isArray(newProduct.category) && newProduct.category.includes(c.id);
                                                        return (
                                                            <button 
                                                                key={c.id} type="button"
                                                                onClick={() => setNewProduct(prev => {
                                                                    const catArray = Array.isArray(prev.category) ? prev.category : [];
                                                                    return {
                                                                        ...prev, 
                                                                        category: isSelected ? catArray.filter(id => id !== c.id) : [...catArray, c.id]
                                                                    }
                                                                })}
                                                                style={{ backgroundColor: isSelected ? c.color : 'transparent', color: isSelected ? c.textColor : '#94a3b8', border: `1px solid ${isSelected ? c.color : '#e2e8f0'}` }}
                                                                className="px-3 py-1.5 rounded-lg text-xs font-bold transition-all"
                                                            >
                                                                {c.name}
                                                            </button>
                                                        )
                                                    })}
                                                </div>
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-400 uppercase mb-1 block">Costo Material</label>
                                                <input type="number" step="0.01" required value={newProduct.cost} onChange={e => setNewProduct({...newProduct, cost: e.target.value})} className="w-full p-3 rounded-2xl bg-slate-50 ring-1 ring-slate-200 outline-none" placeholder="0.00" />
                                            </div>
                                            <div>
                                                <label className="text-xs font-bold text-slate-400 uppercase mb-1 block">Precio de Venta</label>
                                                <input type="number" step="0.01" required value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} className="w-full p-3 rounded-2xl bg-slate-50 ring-1 ring-slate-200 outline-none" placeholder="0.00" />
                                            </div>
                                            <div className="md:col-span-2">
                                                <label className="text-xs font-bold text-slate-400 uppercase mb-1 block">Cantidad en Stock Inicial / Actual</label>
                                                <input type="number" min="0" required value={newProduct.stock} onChange={e => setNewProduct({...newProduct, stock: e.target.value})} className="w-full p-3 rounded-2xl bg-slate-50 ring-1 ring-slate-200 outline-none focus:ring-2 focus:ring-primary" placeholder="Ej. 10" />
                                            </div>
                                            <button 
                                                type="submit" 
                                                disabled={!isProductValid}
                                                className={`md:col-span-2 py-4 rounded-2xl font-bold mt-2 transition-transform active:scale-95 ${isProductValid ? 'bg-primary text-white shadow-lg shadow-primary-glow' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                                {editingProductId ? 'Actualizar Producto' : 'Guardar en Catálogo'}
                                            </button>
                                        </form>
                                    </div>
                                )}

                                <div className="grid gap-4 md:grid-cols-2">
                                    {products
                                        .filter(p => productsListFilter.includes('todos') || (Array.isArray(p.category) ? p.category : [p.category]).some(c => productsListFilter.includes(c)))
                                        .slice()
                                        .sort((a, b) => {
                                            if (productsStockSort === 'asc') return (a.stock || 0) - (b.stock || 0);
                                            if (productsStockSort === 'desc') return (b.stock || 0) - (a.stock || 0);
                                            return 0;
                                        })
                                        .map(p => {
                                        const cats = Array.isArray(p.category) ? p.category : [p.category];
                                        const mockedProductSale = { revenue: p.price, cost: p.cost, rent: getRentValue(p.price), profit: p.price - p.cost - getRentValue(p.price), quantity: 1, revenueNoRent: p.price - getRentValue(p.price) };

                                        return (
                                        <div key={p.id} className="bg-white p-5 rounded-[1.5rem] shadow-sm border border-slate-100 group relative overflow-hidden animate-fade-in">
                                            <div className="flex justify-between items-start mb-3">
                                                <div>
                                                    <h4 className="font-bold text-lg">{p.name}</h4>
                                                    <div className="flex flex-wrap gap-1 mt-1">
                                                        {cats.map(cId => {
                                                            const cat = getCatSettings(cId);
                                                            return <span key={cId} style={{backgroundColor: cat.color, color: cat.textColor}} className="text-[8px] uppercase font-black w-fit px-1.5 py-0.5 rounded opacity-90">{cat.name}</span>
                                                        })}
                                                    </div>
                                                </div>
                                                <div className="flex flex-col items-end">
                                                    <span className="font-black text-xl text-primary">{formatMoney(p.price)}</span>
                                                    <span className={`text-[10px] font-black uppercase mt-1 px-2 py-0.5 rounded ${p.stock > 0 ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'}`}>
                                                        Stock: {p.stock || 0}
                                                    </span>
                                                    <div className="flex gap-2 mt-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                                        <button onClick={() => { setEditingProductId(p.id); setNewProduct({ name: p.name, category: Array.isArray(p.category) ? p.category : [p.category], cost: p.cost.toString(), price: p.price.toString(), stock: p.stock?.toString() || '0' }); setIsAddingProduct(true); }} className="p-2 bg-slate-100 text-slate-500 rounded-xl hover:bg-primary hover:text-white transition-all"><Icon name="edit-2" className="w-4 h-4" /></button>
                                                        <button onClick={() => setProductToDelete(p.id)} className="p-2 bg-red-50 text-red-400 rounded-xl hover:bg-red-500 hover:text-white transition-all"><Icon name="trash-2" className="w-4 h-4" /></button>
                                                    </div>
                                                </div>
                                            </div>
                                            
                                            <div className={`grid grid-cols-2 gap-y-3 pt-3 border-t border-slate-50 text-[11px] font-bold`}>
                                                {productCardStats.map(stat => (
                                                    <div key={stat.id}>
                                                        <p className="text-slate-400 uppercase text-[8px] leading-tight mb-0.5">{stat.name}</p>
                                                        <p className={stat.color}>{formatMoney(getDynamicStatValue(mockedProductSale, stat.id, false, null, true))}</p>
                                                    </div>
                                                ))}
                                                {settings.customStats.filter(cstat => !settings.hiddenStats.includes(cstat.id)).map(cstat => (
                                                    <div key={cstat.id}>
                                                        <p className="text-slate-400 uppercase text-[8px] leading-tight mb-0.5"><Icon name="zap" className="w-2 h-2 inline text-primary" /> {cstat.name}</p>
                                                        <p className="text-slate-700">{formatMoney(getDynamicStatValue(mockedProductSale, null, true, cstat, true))}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )})}
                                </div>
                            </div>
                        )}

                        {/* VENTAS */}
                        {activeTab === 'ventas' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                                    <div className="flex flex-col sm:flex-row justify-between items-center gap-4">
                                        <h2 className="text-2xl font-bold text-slate-700 flex items-center gap-2">
                                            <Icon name="shopping-bag" className="text-primary" /> Ventas
                                        </h2>
                                        <button onClick={() => { setIsCreatingSale(true); setCart([]); setEditingSaleId(null); setPaymentMethod(settings.payments[0]?.id); setSaleDate(new Date().toISOString().slice(0, 16)); }} className="w-full sm:w-auto bg-primary text-white px-5 py-2.5 rounded-2xl font-bold shadow-md shadow-primary-glow">
                                            + Registrar Venta
                                        </button>
                                    </div>
                                    
                                    <div className="mt-4 pt-4 border-t border-slate-50 flex flex-col md:flex-row gap-4">
                                        <DateFilterSelector filter={salesDateFilter} setFilter={setSalesDateFilter} label="Filtro de Fecha" />
                                        <div className="flex flex-col gap-2">
                                            <label className="text-[10px] font-black uppercase text-slate-400 block tracking-widest">Atributos</label>
                                            <div className="flex flex-wrap gap-2">
                                                <div className="flex flex-wrap gap-1 bg-slate-100 p-1 rounded-xl">
                                                    <FilterButton id="todos" current={salesListFilter} label="Todos" type="cat" onClick={() => toggleFilter(salesListFilter, setSalesListFilter, 'todos')} />
                                                    {settings.categories.map(cat => <FilterButton key={cat.id} id={cat.id} current={salesListFilter} label={cat.name} type="cat" onClick={() => toggleFilter(salesListFilter, setSalesListFilter, cat.id)} />)}
                                                </div>
                                                <div className="flex flex-wrap gap-1 bg-slate-100 p-1 rounded-xl">
                                                    <FilterButton id="todos" current={salesPaymentFilter} label="Todos" type="pay" onClick={() => toggleFilter(salesPaymentFilter, setSalesPaymentFilter, 'todos')} />
                                                    {settings.payments.map(pay => <FilterButton key={pay.id} id={pay.id} current={salesPaymentFilter} label={pay.name} type="pay" onClick={() => toggleFilter(salesPaymentFilter, setSalesPaymentFilter, pay.id)} />)}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {isCreatingSale && (
                                    <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                        <div className="bg-white w-full max-w-4xl max-h-[90vh] rounded-[2.5rem] overflow-hidden flex flex-col shadow-2xl animate-fade-in">
                                            <div className="p-6 border-b border-slate-100 flex justify-between items-center">
                                                <div className="flex flex-col md:flex-row md:items-center gap-3">
                                                    <h3 className="text-xl font-bold">{editingSaleId ? 'Editar Venta' : 'Nueva Venta'}</h3>
                                                    <input 
                                                        type="datetime-local" 
                                                        value={saleDate} 
                                                        onChange={e => setSaleDate(e.target.value)} 
                                                        className="text-xs font-bold text-slate-500 bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 outline-none focus:ring-1 focus:ring-primary w-fit"
                                                    />
                                                </div>
                                                <button onClick={() => { setIsCreatingSale(false); setEditingSaleId(null); setCart([]); }} className="text-slate-400 p-2 hover:bg-slate-100 rounded-xl"><Icon name="x" className="w-4 h-4" /></button>
                                            </div>
                                            <div className="flex-1 overflow-y-auto p-6 grid md:grid-cols-2 gap-8">
                                                <div>
                                                    <div className="flex justify-between items-center mb-4">
                                                        <h4 className="font-bold text-slate-500 uppercase text-xs">Catálogo</h4>
                                                        <select value={salesProductFilter} onChange={e => setSalesProductFilter(e.target.value)} className="text-[10px] font-bold bg-slate-50 p-1 rounded-lg outline-none">
                                                            <option value="todos">Todos</option>
                                                            {settings.categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                                        </select>
                                                    </div>
                                                    <div className="grid gap-2">
                                                        {products.filter(p => salesProductFilter === 'todos' || (Array.isArray(p.category) ? p.category : [p.category]).includes(salesProductFilter)).map(p => {
                                                            const pCats = Array.isArray(p.category) ? p.category : [p.category];
                                                            const cat = getCatSettings(pCats[0] || 'default');
                                                            const cartItem = cart.find(i => i.product.id === p.id);
                                                            const qtyInCart = cartItem ? cartItem.quantity : 0;
                                                            const availableStock = (p.stock || 0) - qtyInCart;
                                                            const isOutOfStock = availableStock <= 0;
                                                            
                                                            return (
                                                            <button 
                                                                key={p.id} 
                                                                disabled={isOutOfStock}
                                                                onClick={() => { 
                                                                    if (isOutOfStock) return;
                                                                    setCart(prev => { const ex = prev.find(i => i.product.id === p.id); return ex ? prev.map(i => i.product.id === p.id ? { ...i, quantity: i.quantity + 1 } : i) : [...prev, { product: p, quantity: 1 }]; }); 
                                                                }} 
                                                                className={`flex justify-between items-center p-3 rounded-2xl border transition-all text-left ${isOutOfStock ? 'bg-slate-100 border-slate-200 opacity-60 cursor-not-allowed grayscale' : 'bg-slate-50 border-slate-100 hover:bg-white hover:border-primary group'}`}>
                                                                <div>
                                                                    <p className="font-bold text-sm">{p.name}</p>
                                                                    <div className="flex items-center gap-2">
                                                                        <p className="text-xs font-black text-primary">{formatMoney(p.price)}</p>
                                                                        <span className={`text-[9px] font-bold ${availableStock > 0 ? 'text-green-500' : 'text-red-500'}`}>• Disp: {availableStock}</span>
                                                                    </div>
                                                                </div>
                                                                <div style={{backgroundColor: isOutOfStock ? '#cbd5e1' : cat.color, color: isOutOfStock ? '#64748b' : cat.textColor}} className={`w-8 h-8 rounded-full flex items-center justify-center shadow-sm transition-transform opacity-90 ${isOutOfStock ? '' : 'group-hover:scale-110'}`}>
                                                                    <Icon name={isOutOfStock ? "ban" : "plus"} className="w-4 h-4" />
                                                                </div>
                                                            </button>
                                                        )})}
                                                    </div>
                                                </div>
                                                <div className="flex flex-col h-full bg-slate-50 rounded-3xl p-6 border border-slate-200">
                                                    <h4 className="font-bold text-slate-500 uppercase text-xs mb-4">Carrito</h4>
                                                    <div className="flex-1 space-y-3 overflow-y-auto mb-4 pr-2">
                                                        {cart.map(item => (
                                                            <div key={item.product.id} className="bg-white p-3 rounded-2xl flex justify-between items-center shadow-sm">
                                                                <div className="text-xs">
                                                                    <p className="font-bold">{item.product.name}</p>
                                                                    <p className="text-slate-400">{formatMoney(item.product.price * item.quantity)}</p>
                                                                </div>
                                                                <div className="flex items-center gap-2">
                                                                    <input type="number" min="1" max={item.product.stock || 0} value={item.quantity} onChange={e => { 
                                                                        let qty = parseInt(e.target.value); 
                                                                        if(!isNaN(qty) && qty > 0) {
                                                                            const maxStock = item.product.stock || 0;
                                                                            if (qty > maxStock) qty = maxStock;
                                                                            setCart(prev => prev.map(i => i.product.id === item.product.id ? { ...i, quantity: qty } : i));
                                                                        } 
                                                                    }} className="w-10 text-center bg-slate-50 rounded-lg text-xs font-bold p-1 outline-none ring-1 ring-slate-100" />
                                                                    <button onClick={() => setCart(prev => prev.filter(i => i.product.id !== item.product.id))} className="text-red-400 p-1 hover:bg-red-50 rounded-lg"><Icon name="trash-2" className="w-4 h-4" /></button>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                    <div className="space-y-4 pt-4 border-t border-slate-200">
                                                        <div className="flex flex-wrap gap-2">
                                                            {settings.payments.map(pay => (
                                                                <button key={pay.id} onClick={() => setPaymentMethod(pay.id)} style={paymentMethod === pay.id ? {backgroundColor: pay.color, color: pay.textColor} : {}} className={`flex-1 min-w-[100px] py-2 rounded-xl text-[10px] font-black uppercase transition-all shadow-sm ${paymentMethod !== pay.id ? 'bg-white text-slate-400 ring-1 ring-slate-200' : ''}`}>{pay.name}</button>
                                                            ))}
                                                        </div>
                                                        
                                                        <div className="flex justify-between items-center">
                                                            <span className="text-slate-400 font-bold text-xs uppercase">Total:</span>
                                                            <span className="text-2xl font-black text-primary">
                                                                {formatMoney(cart.reduce((s, i) => s + (i.product.price * i.quantity), 0))}
                                                            </span>
                                                        </div>
                                                        <button 
                                                            onClick={handleSaveSale} 
                                                            disabled={cart.length === 0} 
                                                            className={`w-full py-4 rounded-2xl font-bold transition-all active:scale-[0.98] ${cart.length > 0 ? 'bg-primary text-white shadow-lg shadow-primary-glow' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                                            {editingSaleId ? 'Actualizar Venta' : 'Finalizar Venta'}
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {groupedSalesArray.map(({ date, sales: salesInDate }) => (
                                    <div key={date} className="mb-8">
                                        <div className="flex items-center gap-3 mb-4">
                                            <div className="h-px bg-slate-200 flex-1"></div>
                                            <span className="text-xs font-black text-slate-500 uppercase tracking-widest px-3 py-1.5 bg-white rounded-xl border border-slate-200 shadow-sm flex items-center gap-2">
                                                <Icon name="calendar" className="w-3 h-3 text-primary" /> {date}
                                            </span>
                                            <div className="h-px bg-slate-200 flex-1"></div>
                                        </div>
                                        <div className="space-y-4">
                                            {salesInDate.map(sale => {
                                                const pay = getPaySettings(sale.paymentMethod);
                                                return (
                                                <div key={sale.id} className="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-4">
                                                    <div className="flex-1">
                                                        <div className="flex items-center gap-2 mb-2 text-[10px] font-black uppercase">
                                                            <span className="bg-primary/10 text-primary px-2 py-0.5 rounded-md uppercase font-black">{sale.id}</span>
                                                            <span className="text-slate-400 font-bold">{sale.date.split(',')[1]?.trim() || sale.date}</span>
                                                            <span style={{backgroundColor: pay.color, color: pay.textColor}} className="px-2 py-0.5 rounded shadow-sm opacity-90">{pay.name}</span>
                                                        </div>
                                                        <p className="text-sm font-bold text-slate-700 mb-3">{sale.items.map(i => `${i.quantity}x ${i.product.name}`).join(', ')}</p>
                                                        
                                                        {/* Desglose de Tarjeta de Venta Dinámica */}
                                                        <div className="flex flex-wrap gap-2 bg-slate-50 p-3 rounded-2xl text-[10px] font-bold border border-slate-100">
                                                            {tableDisplayStats.map(stat => (
                                                                <div key={stat.id} className="min-w-[70px]">
                                                                    <p className="text-slate-400 uppercase text-[8px] leading-tight mb-0.5">{stat.name}</p>
                                                                    <p className={stat.color}>{formatMoney(getDynamicStatValue(sale, stat.id))}</p>
                                                                </div>
                                                            ))}
                                                            {settings.customStats.filter(cstat => !settings.hiddenStats.includes(cstat.id) && (!Array.isArray(cstat.paymentMethods) || cstat.paymentMethods.length === 0 || cstat.paymentMethods.includes(sale.paymentMethod))).map((cstat, idx) => {
                                                                const existedAtSaleTime = !cstat.createdAt || !sale.isoDate || sale.isoDate >= cstat.createdAt;
                                                                return (
                                                                <div key={`c-${idx}`} className="min-w-[70px]">
                                                                    <p className="text-slate-400 uppercase text-[8px] leading-tight mb-0.5"><Icon name="zap" className="w-2 h-2 inline text-primary" /> {cstat.name}</p>
                                                                    <p className="text-slate-700">{existedAtSaleTime ? formatMoney(getDynamicStatValue(sale, null, true, cstat)) : '—'}</p>
                                                                </div>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <button onClick={() => setSelectedSaleReceipt(sale)} className="flex-1 bg-slate-50 text-slate-500 px-4 py-3 rounded-2xl font-bold border border-slate-100 flex items-center justify-center hover:bg-slate-200 transition-colors"><Icon name="receipt-text" className="w-5 h-5" /></button>
                                                        <button onClick={() => { setEditingSaleId(sale.id); setCart(sale.items); setPaymentMethod(sale.paymentMethod); setIsCreatingSale(true); setSaleDate(new Date(sale.isoDate || new Date()).toISOString().slice(0, 16)); }} className="flex-1 bg-primary/10 text-primary px-4 py-3 rounded-2xl font-bold hover:bg-primary hover:text-white flex items-center justify-center transition-colors"><Icon name="edit-3" className="w-5 h-5" /></button>
                                                        <button onClick={() => setSaleToDelete(sale.id)} className="flex-1 bg-red-50 text-red-400 px-4 py-3 rounded-2xl font-bold hover:bg-red-500 hover:text-white flex items-center justify-center transition-colors"><Icon name="trash-2" className="w-5 h-5" /></button>
                                                    </div>
                                                </div>
                                            )})}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* INVENTARIO */}
                        {activeTab === 'inventario' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100">
                                    <h2 className="text-2xl font-bold text-slate-700 flex items-center gap-2 mb-5">
                                        <Icon name="list-checks" className="text-primary" /> Historial
                                    </h2>
                                    <div className="flex flex-col md:flex-row gap-4 mb-2">
                                        <DateFilterSelector filter={reportDateFilter} setFilter={setReportDateFilter} label="Filtro de Fecha" />
                                        <div className="flex-1">
                                            <label className="text-[10px] font-black uppercase text-slate-400 block mb-2 tracking-widest">Categoría</label>
                                            <div className="flex flex-wrap gap-1 bg-slate-100 p-1 rounded-xl w-fit max-w-full">
                                                <FilterButton id="todos" current={reportCategoryFilter} label="Todos" type="cat" onClick={() => toggleFilter(reportCategoryFilter, setReportCategoryFilter, 'todos')} />
                                                {settings.categories.map(cat => <FilterButton key={cat.id} id={cat.id} current={reportCategoryFilter} label={cat.name} type="cat" onClick={() => toggleFilter(reportCategoryFilter, setReportCategoryFilter, cat.id)} />)}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                {/* Tabla de Historial Dinámica */}
                                <div className="sold-table-container pb-4">
                                    <table className="sold-table">
                                        <thead>
                                            <tr>
                                                <th className="w-14 text-center">Cant.</th>
                                                <th>Producto</th>
                                                {tableDisplayStats.map(stat => (
                                                    <th key={stat.id}>{stat.name}</th>
                                                ))}
                                                {settings.customStats.filter(stat => !settings.hiddenStats.includes(stat.id)).map(stat => (
                                                    <th key={stat.id}><Icon name="zap" className="w-2 h-2 inline text-primary" /> {stat.name}</th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {soldProductsData.map((p) => {
                                                const cats = Array.isArray(p.category) ? p.category : [p.category];
                                                return (
                                                <tr key={p.id} className="group transition-transform">
                                                    <td className="text-center">
                                                        <div className="w-10 h-10 rounded-xl flex items-center justify-center mx-auto text-sm font-black bg-primary/10 text-primary">{p.quantity}</div>
                                                    </td>
                                                    <td>
                                                        <div className="flex flex-col">
                                                            <span className="font-bold text-slate-800 leading-tight">{p.name}</span>
                                                            <div className="flex flex-wrap gap-1 mt-1">
                                                                {cats.map(cId => {
                                                                    const cat = getCatSettings(cId);
                                                                    return <span key={cId} style={{backgroundColor: cat.color, color: cat.textColor}} className="text-[8px] uppercase font-black w-fit px-1.5 py-0.5 rounded opacity-90">{cat.name}</span>
                                                                })}
                                                            </div>
                                                        </div>
                                                    </td>
                                                    {tableDisplayStats.map(stat => (
                                                        <td key={stat.id} className={`text-xs font-bold ${stat.color}`}>
                                                            {formatMoney(getDynamicStatValue(p, stat.id, false, null, true))}
                                                        </td>
                                                    ))}
                                                    {settings.customStats.filter(cstat => !settings.hiddenStats.includes(cstat.id)).map(cstat => (
                                                        <td key={cstat.id} className="text-xs font-bold text-slate-700">
                                                            {getProductCustomStatDisplay(p, cstat)}
                                                        </td>
                                                    ))}
                                                </tr>
                                            )})}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* REPORTES */}
                        {activeTab === 'reportes' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100">
                                    <div className="flex justify-between items-center mb-5">
                                        <h2 className="text-2xl font-bold text-slate-700 flex items-center gap-2">
                                            <Icon name="pie-chart" className="text-primary" /> Reportes
                                        </h2>
                                        <button onClick={handleExportPDF} className="p-2 bg-slate-50 text-slate-500 rounded-xl hover:bg-primary hover:text-white transition-all flex items-center gap-2 border border-slate-100">
                                            <Icon name="file-text" className="w-5 h-5" />
                                            <span className="text-xs font-bold hidden sm:inline uppercase tracking-widest">Descargar PDF</span>
                                        </button>
                                    </div>
                                    
                                    <div className="flex flex-col md:flex-row gap-4">
                                        <DateFilterSelector filter={reportDateFilter} setFilter={setReportDateFilter} label="Corte de Caja" />
                                        <div className="flex-1 flex flex-col gap-3">
                                            <label className="text-[10px] font-black uppercase text-slate-400 block tracking-widest">Categoría</label>
                                            <div className="flex flex-wrap gap-1 bg-slate-100 p-1 rounded-xl w-fit max-w-full">
                                                <FilterButton id="todos" current={reportCategoryFilter} label="Todos" type="cat" onClick={() => toggleFilter(reportCategoryFilter, setReportCategoryFilter, 'todos')} />
                                                {settings.categories.map(cat => <FilterButton key={cat.id} id={cat.id} current={reportCategoryFilter} label={cat.name} type="cat" onClick={() => toggleFilter(reportCategoryFilter, setReportCategoryFilter, cat.id)} />)}
                                            </div>
                                        </div>
                                        <div className="flex-1 flex flex-col gap-3">
                                            <label className="text-[10px] font-black uppercase text-slate-400 block tracking-widest">Tipo de Pago</label>
                                            <div className="flex flex-wrap gap-1 bg-slate-100 p-1 rounded-xl w-fit max-w-full">
                                                <FilterButton id="todos" current={reportPaymentFilter} label="Todos" type="pay" onClick={() => toggleFilter(reportPaymentFilter, setReportPaymentFilter, 'todos')} />
