                                                {settings.payments.map(pay => <FilterButton key={pay.id} id={pay.id} current={reportPaymentFilter} label={pay.name} type="pay" onClick={() => toggleFilter(reportPaymentFilter, setReportPaymentFilter, pay.id)} />)}
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <StatsDashboard statsData={stats} title="Resumen Financiero General" />
                            </div>
                        )}

                        {/* COBRO */}
                        {activeTab === 'transferencia' && (
                            <div className="space-y-6 animate-fade-in pb-10">
                                <div className="bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100 flex justify-between items-center">
                                    <h2 className="text-xl font-bold text-slate-700 flex items-center gap-2">
                                        <Icon name="landmark" className="text-primary w-5 h-5" /> Datos Bancarios
                                    </h2>
                                    <button onClick={() => setIsEditingTransfer(!isEditingTransfer)} className="p-2 bg-slate-50 text-slate-400 rounded-xl hover:text-primary transition-all">
                                        <Icon name={isEditingTransfer ? "x" : "edit-2"} className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="bank-card-container p-6 md:p-8">
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full -mr-20 -mt-20 blur-3xl pointer-events-none"></div>
                                    <div className="relative z-10 space-y-6">
                                        <div className="flex justify-between items-start mb-4">
                                            {isEditingTransfer ? (
                                                <input type="text" value={transferData.banco} onChange={e => setTransferData({...transferData, banco: e.target.value})} className="bank-card-input text-xs font-bold uppercase tracking-widest w-40" placeholder="AÑADIR BANCO" />
                                            ) : (
                                                <div className="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-lg border border-white/10">
                                                    <Icon name="building-2" className="w-4 h-4 text-white" />
                                                    <span className="text-[10px] font-black uppercase tracking-widest">{transferData.banco || 'BANCO'}</span>
                                                </div>
                                            )}
                                        </div>
                                        <div className="space-y-1">
                                            <p className="text-[10px] font-black uppercase text-white/40 tracking-widest">Titular de la cuenta</p>
                                            {isEditingTransfer ? (
                                                <input type="text" value={transferData.titular} onChange={e => setTransferData({...transferData, titular: e.target.value})} className="bank-card-input text-lg font-bold" placeholder="Añadir nombre" />
                                            ) : (
                                                <p className="text-xl font-bold tracking-tight">{transferData.titular || 'Añadir nombre de titular'}</p>
                                            )}
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                                            <div className="space-y-1">
                                                <p className="text-[10px] font-black uppercase text-white/40 tracking-widest">Cuenta / Tarjeta</p>
                                                {isEditingTransfer ? <input type="text" value={transferData.cuenta} onChange={e => setTransferData({...transferData, cuenta: e.target.value})} className="bank-card-input font-mono" placeholder="---- ---- ---- ----" /> : <p className="text-lg font-mono tracking-widest opacity-90">{transferData.cuenta || '---- ---- ---- ----'}</p>}
                                            </div>
                                            <div className="space-y-1">
                                                <p className="text-[10px] font-black uppercase text-white/40 tracking-widest">Clabe</p>
                                                {isEditingTransfer ? <input type="text" value={transferData.clabe} onChange={e => setTransferData({...transferData, clabe: e.target.value})} className="bank-card-input font-mono" placeholder="------------------" /> : <p className="text-lg font-mono tracking-tighter opacity-90">{transferData.clabe || '------------------'}</p>}
                                            </div>
                                        </div>
                                        {!isEditingTransfer ? (
                                            <div className="pt-6 border-t border-white/5">
                                                <button onClick={copyToClipboard} className="w-full bg-primary hover:opacity-90 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-[0.1em] flex items-center justify-center gap-3 transition-all active:scale-[0.98] shadow-lg shadow-black/20">
                                                    {copyStatus ? <><Icon name="check" className="w-4 h-4" /> ¡Datos Copiados!</> : <><Icon name="copy" className="w-4 h-4" /> Copiar Datos</>}
                                                </button>
                                            </div>
                                        ) : (
                                            <button onClick={() => setIsEditingTransfer(false)} className="w-full bg-white text-[#1e293b] py-4 rounded-2xl font-black uppercase text-xs tracking-widest mt-4">Guardar Datos</button>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODALES CONFIRMACIONES DE BORRADO */}
                    {saleToDelete && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-end sm:items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl animate-slide-up sm:animate-fade-in text-center">
                                <div className="bg-red-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-red-500">
                                    <Icon name="alert-triangle" className="w-10 h-10" />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">¿Eliminar registro?</h3>
                                <p className="text-sm text-slate-400 font-medium">Esta acción no se puede deshacer y alterará tus estadísticas.</p>
                                <div className="grid grid-cols-2 gap-3 mt-8">
                                    <button onClick={() => setSaleToDelete(null)} className="py-4 rounded-2xl bg-slate-100 text-slate-500 font-bold uppercase text-xs tracking-widest transition-colors hover:bg-slate-200">Cancelar</button>
                                    <button onClick={confirmDeleteSale} className="py-4 rounded-2xl bg-red-500 text-white font-bold shadow-lg shadow-red-500/30 uppercase text-xs tracking-widest transition-transform active:scale-95">Sí, eliminar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {productToDelete && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-end sm:items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl animate-slide-up sm:animate-fade-in text-center">
                                <div className="bg-red-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-red-500">
                                    <Icon name="package-x" className="w-10 h-10" />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">¿Eliminar producto?</h3>
                                <p className="text-sm text-slate-400 font-medium">Se quitará de forma permanente del catálogo.</p>
                                <div className="grid grid-cols-2 gap-3 mt-8">
                                    <button onClick={() => setProductToDelete(null)} className="py-4 rounded-2xl bg-slate-100 text-slate-500 font-bold uppercase text-xs tracking-widest transition-colors hover:bg-slate-200">Cancelar</button>
                                    <button onClick={confirmDeleteProduct} className="py-4 rounded-2xl bg-red-500 text-white font-bold shadow-lg shadow-red-500/30 uppercase text-xs tracking-widest transition-transform active:scale-95">Eliminar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {profileToDelete && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[60] flex items-end sm:items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl animate-slide-up sm:animate-fade-in text-center">
                                <div className="bg-red-50 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6 text-red-500">
                                    <Icon name="briefcase" className="w-10 h-10" />
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 mb-2">¿Eliminar este negocio?</h3>
                                <p className="text-sm text-slate-400 font-medium">Se borrarán permanentemente su catálogo, ventas y ajustes. Esta acción no se puede deshacer.</p>
                                <div className="grid grid-cols-2 gap-3 mt-8">
                                    <button onClick={() => setProfileToDelete(null)} className="py-4 rounded-2xl bg-slate-100 text-slate-500 font-bold uppercase text-xs tracking-widest transition-colors hover:bg-slate-200">Cancelar</button>
                                    <button onClick={confirmDeleteProfile} className="py-4 rounded-2xl bg-red-500 text-white font-bold shadow-lg shadow-red-500/30 uppercase text-xs tracking-widest transition-transform active:scale-95">Sí, eliminar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TICKET DE VENTA */}
                    {selectedSaleReceipt && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-[300px] rounded-[2rem] overflow-hidden shadow-2xl relative animate-fade-in">
                                <button onClick={() => setSelectedSaleReceipt(null)} className="absolute top-4 right-4 text-white hover:opacity-75 z-10 bg-black/10 rounded-full p-1 backdrop-blur-sm"><Icon name="x" className="w-5 h-5" /></button>
                                <div className="bg-primary text-white text-center p-6 flex flex-col items-center">
                                    <div className="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mb-2">
                                        <img src={settings.logoUrl || "logo_blanco.png"} alt="Logo" className={`w-10 h-10 object-contain ${isDefaultLogo ? 'header-logo' : ''}`} onError={(e) => e.target.style.display='none'} />
                                    </div>
                                    <h3 className="text-xl font-black tracking-widest uppercase">{settings.companyName}</h3>
                                </div>
                                <div className="p-6">
                                    <div className="text-center text-[9px] font-bold text-slate-400 mb-5 uppercase tracking-widest">
                                        <p>ID: {selectedSaleReceipt.id}</p>
                                        <p>{new Date(selectedSaleReceipt.isoDate).toLocaleString()}</p>
                                        <p className="mt-1 font-black text-primary">{getPaySettings(selectedSaleReceipt.paymentMethod).name}</p>
                                    </div>
                                    <div className="space-y-3 mb-5 border-t border-dashed border-slate-200 pt-4">
                                        {selectedSaleReceipt.items.map((item, idx) => (
                                            <div key={idx} className="flex justify-between items-start">
                                                <div className="flex flex-col"><span className="text-xs font-black text-slate-800">{item.product.name}</span><span className="text-[9px] font-bold text-slate-400">{item.quantity} x {formatMoney(item.product.price)}</span></div>
                                                <span className="text-xs font-black text-slate-800">{formatMoney(item.product.price * item.quantity)}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="border-t border-dashed border-slate-200 pt-4 mb-2">
                                        <div className="flex justify-between items-end">
                                            <span className="text-[9px] font-black text-slate-400 uppercase">Total Pagado</span>
                                            <span className="text-2xl font-black text-primary">{formatMoney(selectedSaleReceipt.totalVenta)}</span>
                                        </div>
                                    </div>
                                    <div className="bg-slate-50 p-4 rounded-2xl text-center mt-5 border border-slate-100 shadow-sm">
                                        <p className="text-[12px] font-black text-slate-700">¡Gracias por tu compra!</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    <nav className="no-print fixed bottom-0 w-full bg-white/90 backdrop-blur-md border-t border-slate-100 flex justify-around p-3 z-40 shadow-[0_-10px_30px_rgba(0,0,0,0.05)] overflow-x-auto">
                        {[
                            { id: 'productos', icon: 'package', label: 'Catálogo' },
                            { id: 'transferencia', icon: 'credit-card', label: 'Cobro' },
                            { id: 'ventas', icon: 'shopping-bag', label: 'Ventas' },
                            { id: 'inventario', icon: 'list-checks', label: 'Historial' },
                            { id: 'reportes', icon: 'pie-chart', label: 'Reportes' },
                            { id: 'perfil', icon: 'user', label: 'Perfil' }
                        ].map(t => (
                            <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex flex-col items-center gap-1 p-2 md:p-3 rounded-2xl transition-all duration-300 min-w-[60px] ${activeTab === t.id ? 'bg-primary text-white shadow-lg shadow-primary-glow' : 'text-slate-400 hover:text-slate-600'}`}>
                                <Icon name={t.icon} className="w-5 h-5 md:w-6 md:h-6" />
                                {activeTab === t.id && <span className="text-[8px] font-black uppercase whitespace-nowrap">{t.label}</span>}
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        // ===== PANTALLA DE ACCESO (Netlify Identity) =====
        function AuthGate() {
            const [status, setStatus] = useState('loading'); // loading | login | ready
            const [authError, setAuthError] = useState('');

            useEffect(() => {
                const identity = window.netlifyIdentity;
                if (!identity) {
                    setAuthError('No se pudo cargar el sistema de acceso (netlify-identity-widget). Revisa tu conexión.');
                    setStatus('login');
                    return;
                }

                // El widget a veces deja un "#access_token=..." (u otro token) pegado en la URL
                // después de procesar el login/confirmación. Aunque no se vea, ese sobrante puede
                // dejar bloqueados los clics. Lo quitamos de la barra de direcciones sin recargar.
                const clearAuthHash = () => {
                    if (window.location.hash) {
                        window.history.replaceState(null, '', window.location.pathname + window.location.search);
                    }
                };

                identity.on('init', async (user) => {
                    clearAuthHash();
                    if (user) {
                        window.__cloudSyncEnabled = true;
                        await window.__pullFromCloud();
                        setStatus('ready');
                    } else {
                        setStatus('login');
                    }
                });

                identity.on('login', async (user) => {
                    window.__cloudSyncEnabled = true;
                    await window.__pullFromCloud();
                    setStatus('ready');
                    identity.close();
                    clearAuthHash();
                });

                identity.on('logout', () => {
                    window.__cloudSyncEnabled = false;
                    clearAuthHash();
                    window.location.reload();
                });

                identity.on('error', (err) => {
                    console.error('Error de Netlify Identity:', err);
                    setAuthError('Ocurrió un error con el inicio de sesión.');
                    clearAuthHash();
                });

                // init() dispara el evento 'init' de arriba con el usuario actual (o null)
                identity.init();
                // Red de seguridad: si por alguna razón ningún evento de arriba llegó a
                // disparar, igual limpiamos la URL medio segundo después.
                setTimeout(clearAuthHash, 800);
            }, []);

            if (status === 'loading') {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50">
                        <div className="text-slate-400 font-black text-xs uppercase tracking-widest">Cargando...</div>
                    </div>
                );
            }

            if (status === 'login') {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 p-4">
                        <div className="bg-white w-full max-w-sm rounded-[2.5rem] p-8 shadow-2xl space-y-4 text-center">
                            <h1 className="text-xl font-black text-slate-800 mb-2">Bienvenido</h1>
                            <p className="text-slate-400 text-sm font-bold mb-4">Inicia sesión o crea una cuenta para entrar a tu negocio.</p>
                            {authError && <p className="text-red-500 text-xs font-bold">{authError}</p>}
                            <button
                                onClick={() => window.netlifyIdentity && window.netlifyIdentity.open('login')}
                                className="w-full bg-primary text-white py-3 rounded-2xl font-black uppercase text-xs tracking-widest"
                            >
                                Iniciar sesión
                            </button>
                            <button
                                onClick={() => window.netlifyIdentity && window.netlifyIdentity.open('signup')}
                                className="w-full text-slate-400 text-xs font-bold"
                            >
                                ¿No tienes cuenta? Regístrate
                            </button>
                        </div>
                    </div>
                );
            }

            return <App />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AuthGate />);
    </script>
</body>
</html>
